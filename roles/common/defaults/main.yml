---
# ---------------------------------------------------------------------------
# Package upgrades
# ---------------------------------------------------------------------------
# `apt upgrade` on every site.yml run is a SECOND patch policy, competing with
# the deliberate one this role installs further down: unattended-upgrades,
# security only, Automatic-Reboot false. That one is considered and predictable.
# An unconditional upgrade here is neither - it is broader than security-only
# and it fires whenever an operator runs site.yml for some unrelated reason,
# which on a live fleet can stage a kernel that then waits on the manual-reboot
# rule nobody was thinking about.
#
# So: upgrade automatically only while the box is still being BUILT, which is
# exactly when bootstrap_mode is true (site.yml sets it when the admin key does
# not work yet). On a hardened box it takes an explicit:
#
#   ansible-playbook site.yml -l chic-1 -e common_apt_upgrade=true
#   ansible-playbook site.yml -l chic-1 --tags apt-upgrade -e common_apt_upgrade=true
#
# Security updates keep arriving on their own in the meantime; this switch is
# about when a WHOLE-SYSTEM upgrade happens, not about whether patching happens.
common_apt_upgrade: "{{ bootstrap_mode | default(false) }}"

# Installed everywhere. Debian-only additions are in common_distro_packages.
common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - htop
  - iotop
  - ncdu
  - net-tools
  - rsync
  - unzip
  - chrony
  - unattended-upgrades
  - apt-listchanges
  - python3-kubernetes   # lets Ansible drive k8s later without pip

common_distro_packages:
  Ubuntu: [dnsutils]
  Debian: [sudo, bind9-dnsutils, apparmor]

# Origins allowed on top of the distribution's own 50unattended-upgrades.
common_unattended_extra_origins: []

# The node_reboot_required metric (an hourly timer writing a textfile for
# node-exporter). needrestart's list-only mode is not part of this: every box
# gets it. Off on the IPFS boxes, whose node-exporter does not read the file.
common_reboot_reporting: false

# node-exporter reads *.prom from here once it is given
# --collector.textfile.directory (ipni/infra kubernetes/platform/node-exporter).
common_textfile_dir: /var/lib/node_exporter/textfile

# Ubuntu's package sources (tasks/apt_sources.yml): the release, -updates and
# -backports from the provider's mirror, signed with the provider's key; the
# security pocket from Ubuntu, signed with Ubuntu's.
common_apt_mirror_uri: http://repo.cherryservers.com/ubuntu/
common_apt_mirror_keyring: /usr/share/keyrings/cherryservers-signing-public.gpg
common_apt_security_uri: http://security.ubuntu.com/ubuntu/
common_apt_security_keyring: /usr/share/keyrings/ubuntu-archive-keyring.gpg
common_apt_components: [main, universe, restricted, multiverse]

# Touched by an apt hook after each successful package-list refresh, for
# node_apt_lists_refresh_timestamp_seconds (tasks/apt_lists_metric.yml).
common_apt_refresh_stamp: /var/lib/apt/periodic/ipni-update-success-stamp
