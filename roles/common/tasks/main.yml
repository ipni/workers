---
# The hostname is the box name (e.g. chic-1), not the location: a second box in
# the same site must not collide.
- name: Set hostname to the box name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Read current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: current_tz
  check_mode: false
  changed_when: false

- name: Set timezone to UTC
  ansible.builtin.command: timedatectl set-timezone UTC
  when: current_tz.stdout | trim != 'UTC'
  changed_when: true

# Refreshing the package lists changes nothing installed. Reported as a change,
# it would be one on every run, and in every dry run an approver reads.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

# Gated: see common_apt_upgrade in defaults/main.yml for why this does not run
# unprompted on a box that is already carrying traffic.
- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe
  register: apt_upgrade
  retries: 3
  delay: 10
  until: apt_upgrade is succeeded
  when: common_apt_upgrade | bool
  tags: [apt-upgrade]

- name: Report that the whole-system upgrade was skipped
  ansible.builtin.debug:
    msg: >-
      Skipped `apt upgrade` on {{ inventory_hostname }}: this box is already
      hardened, and unattended-upgrades handles security updates. Re-run with
      -e common_apt_upgrade=true to upgrade everything.
  when: not (common_apt_upgrade | bool)
  tags: [apt-upgrade]

- name: Install base packages
  ansible.builtin.apt:
    # sudo: the admin user depends on it, and a minimal Debian may not have it.
    # On Debian dnsutils is only a virtual package, provided by bind9-dnsutils,
    # and k3s's containers need apparmor_parser while the kernel has AppArmor on.
    name: "{{ common_base_packages + common_distro_packages[ansible_distribution] | default([]) }}"
    state: present

- name: Enable and start chrony for time sync
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Swap off — kubelet behaves unpredictably with swap enabled, and with 123 GiB
# of RAM there is no need for it.
# ---------------------------------------------------------------------------
- name: Check for active swap
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: active_swap
  check_mode: false
  changed_when: false

- name: Disable all active swap
  ansible.builtin.command: swapoff -a
  when: active_swap.stdout | trim | length > 0
  changed_when: true

- name: Remove swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n].*\s+swap\s+.*)$'
    replace: '# \1  # disabled for kubernetes'

- name: Detect Ubuntu cloud-image swapfile
  ansible.builtin.stat:
    path: /swap.img
  register: swapimg

- name: Remove the cloud-image swapfile
  ansible.builtin.file:
    path: /swap.img
    state: absent
  when: swapimg.stat.exists

# ---------------------------------------------------------------------------
# Kernel tuning for libp2p connection counts and QUIC/UDP throughput
# ---------------------------------------------------------------------------
# net.netfilter.nf_conntrack_max only exists once nf_conntrack is loaded. This
# role runs before ufw and k3s (which would load it), so on a genuinely bare
# host the sysctl key would be missing and the loop below would fail.
- name: Ensure nf_conntrack is loaded before its sysctls are set
  community.general.modprobe:
    name: nf_conntrack
    state: present

# Persisted with copy rather than modprobe's `persistent: present`: in
# community.general 8.3.0 that option writes /etc/modules-load.d even under
# --check, which breaks the promise that a dry run touches nothing.
- name: Load nf_conntrack on every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nf_conntrack.conf
    content: "nf_conntrack\n"
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-ipfs-tuning.conf
    state: present
    reload: true
  loop: "{{ sysctl_tuning | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Raise file descriptor limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-ipfs.conf
    mode: "0644"
    content: |
      # Managed by Ansible. libp2p holds very large numbers of open sockets.
      *    soft nofile {{ nofile_limit }}
      *    hard nofile {{ nofile_limit }}
      root soft nofile {{ nofile_limit }}
      root hard nofile {{ nofile_limit }}

- name: Ensure the systemd manager drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Raise systemd default file descriptor limit
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/99-nofile.conf
    mode: "0644"
    content: |
      [Manager]
      DefaultLimitNOFILE={{ nofile_limit }}
  notify: Reload systemd daemon

# ---------------------------------------------------------------------------
# Postfix was found listening on 0.0.0.0:25 on a freshly provisioned host.
# Nothing here needs to accept inbound mail; restrict it to loopback so local
# cron and unattended-upgrades reports still work.
# ---------------------------------------------------------------------------
- name: Check whether Postfix is installed
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_main_cf

- name: Bind Postfix to loopback only
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^inet_interfaces\s*='
    line: 'inet_interfaces = loopback-only'
    state: present
  when: postfix_main_cf.stat.exists
  notify: Restart postfix

- name: Restrict Postfix to IPv4 loopback to avoid IPv6 bind errors
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^inet_protocols\s*='
    line: 'inet_protocols = ipv4'
    state: present
  when: postfix_main_cf.stat.exists
  notify: Restart postfix

# ---------------------------------------------------------------------------
# Automatic security updates
# ---------------------------------------------------------------------------
- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# With the defaults this keeps the distribution's own allowed origins, which on
# Ubuntu (Cherry's mirror included) is -security only. An indexer adds
# origin-and-codename patterns, because Debian's label-based defaults match
# nothing on Cherry's mirror: see group_vars/indexers.
- name: Configure unattended-upgrades to security only, no auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-ipfs-unattended
    mode: "0644"
    content: |
      // Managed by Ansible.
      // Reboots are deliberately manual: these nodes serve IPFS content and
      // should be drained intentionally rather than restarted unattended.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      {% if common_unattended_extra_origins %}
      Unattended-Upgrade::Origins-Pattern {
      {% for origin in common_unattended_extra_origins %}
        "{{ origin }}";
      {% endfor %}
      };
      {% endif %}

# Cherry's Ubuntu image ships this file with `APT::Periodic::Enable "0"`. It
# belongs to no package and is not ours, and it sorts after 20auto-upgrades and
# 99*, so it wins: apt-daily and apt-daily-upgrade start and exit at once, and
# nothing above ever runs. Found 2026-11-11 on sing-1, lith-1 and chic-1: no
# /var/log/unattended-upgrades at all, package lists weeks old, openssh-server
# one security release behind and 72-80 -security upgrades pending on each.
# Removed rather than overridden, so no file of ours has to sort after it.
- name: Remove the provider's switch that turns periodic apt off
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/docker-disable-periodic-update
    state: absent

# A package upgrade on a box can restart services through needrestart. `l` only
# lists them: k3s and everything it runs restart when a person decides, not at
# 06:00 on every box at once. Set before the first unattended run picks it up.
- name: Install needrestart
  ansible.builtin.apt:
    name: needrestart
    state: present

- name: Keep needrestart to listing what needs a restart
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-ipni.conf
    mode: "0644"
    content: |
      # Managed by Ansible.
      $nrconf{restart} = 'l';

# apt reads every file under apt.conf.d and the last value wins, so a file
# someone else drops in can quietly switch the timers off again, as above. Ask
# apt what it settled on. Skipped in a dry run, where the removal has not
# happened and the answer would still be the old one.
- name: Read the periodic apt settings apt is actually using
  ansible.builtin.command:
    argv:
      - apt-config
      - shell
      - enable
      - APT::Periodic::Enable
      - unattended
      - APT::Periodic::Unattended-Upgrade
  register: apt_periodic_effective
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Fail unless unattended upgrades really run
  ansible.builtin.assert:
    that:
      - "\"enable='0'\" not in apt_periodic_effective.stdout_lines"
      - "\"unattended='1'\" in apt_periodic_effective.stdout_lines"
    fail_msg: >-
      {{ inventory_hostname }}: another file under /etc/apt/apt.conf.d turns
      periodic apt off; apt-config shows {{ apt_periodic_effective.stdout_lines }}.
    quiet: true
  when: not ansible_check_mode

- name: Report pending reboots and restarts
  ansible.builtin.import_tasks: reboot_reporting.yml
  when: common_reboot_reporting | bool
