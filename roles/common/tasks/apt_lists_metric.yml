---
# node_apt_security_lists_timestamp_seconds: when the newest security index
# this box has was published (the `Date:` of its <release>-security InRelease).
# A mirror that stops updating still answers `apt-get update` without an error,
# so this is how a box that has quietly stopped seeing security fixes shows up.
#
# A timestamp rather than an age: an age is frozen at whatever it was when the
# file was last written, so it would stop growing in exactly the case it is
# for, a box whose lists stop refreshing. Alert on
# `time() - node_apt_security_lists_timestamp_seconds`. 0 means no security
# index at all.
#
# Rewritten after every package-list refresh (an apt hook) and on every run of
# this role. Read by node-exporter's textfile collector, see
# common_textfile_dir.

- name: Create the node-exporter textfile directory
  ansible.builtin.file:
    path: "{{ common_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the security-lists age reporter
  ansible.builtin.copy:
    dest: /usr/local/sbin/ipni-apt-lists-metric
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/sh
      # Managed by Ansible. Writes node_apt_security_lists_timestamp_seconds
      # for node-exporter: the Date: of the newest security index apt has.
      set -eu
      newest=0
      for f in /var/lib/apt/lists/*_dists_{{ ansible_distribution_release }}-security_InRelease; do
        [ -e "$f" ] || continue
        t=$(stat -c %Y "$f")
        d=$(sed -n 's/^Date: //p' "$f" | head -n 1)
        if [ -n "$d" ] && dt=$(date -d "$d" +%s 2>/dev/null); then t=$dt; fi
        if [ "$t" -gt "$newest" ]; then newest=$t; fi
      done
      tmp="{{ common_textfile_dir }}/.apt-security-lists.prom.$$"
      printf '# HELP node_apt_security_lists_timestamp_seconds When the newest security package index on this box was published (0: none).\n# TYPE node_apt_security_lists_timestamp_seconds gauge\nnode_apt_security_lists_timestamp_seconds %s\n' "$newest" > "$tmp"
      chmod 0644 "$tmp"
      mv "$tmp" "{{ common_textfile_dir }}/apt-security-lists.prom"

# Post-Invoke, not Post-Invoke-Success: a refresh that partly fails still
# leaves lists behind worth reporting. Never fails the refresh itself.
- name: Report the security lists' age after every package-list refresh
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80ipni-apt-lists-metric
    mode: "0644"
    owner: root
    group: root
    content: |
      // Managed by Ansible.
      APT::Update::Post-Invoke { "/usr/local/sbin/ipni-apt-lists-metric || true"; };

# So the file exists from the first run, not only after the next refresh.
# Skipped in a dry run, where the reporter may not be installed yet.
- name: Report the security lists' age now
  ansible.builtin.command: /usr/local/sbin/ipni-apt-lists-metric
  changed_when: false
  when: not ansible_check_mode
