---
# Ports of the content cluster node. Must match k8s/content/deployment.yaml and
# net.ipv4.ip_local_reserved_ports in group_vars/ipfs_nodes/main.yml.
content_kubo_swarm_port: 4101     # public, TCP + UDP
content_kubo_api_port: 5021       # loopback
content_cluster_api_port: 9094    # loopback (REST API)
content_cluster_swarm_port: 9096  # TCP, the other boxes only

# Public bootstrap peers the content kubo dials, after this project's own
# bootstrappers (/dnsaddr/bootstrap.ipni.io, one entry per box, added by the
# role). The same public list the bootstrappers use
# (roles/bootstrap/defaults/main.yml); keep the two in step.
content_public_bootstrap_peers:
