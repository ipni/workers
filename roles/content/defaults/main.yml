---
# Ports of the content cluster node. Must match k8s/content/deployment.yaml and
# net.ipv4.ip_local_reserved_ports in group_vars/ipfs_nodes/main.yml.
content_kubo_swarm_port: 4101     # public, TCP + UDP
content_kubo_api_port: 5021       # loopback
content_cluster_metrics_port: 8888  # loopback (Prometheus metrics)
content_cluster_api_port: 9094    # loopback (REST API)
content_cluster_swarm_port: 9096  # TCP, the other boxes only
content_pinsvc_port: 9097         # loopback (Pinning Service API, behind Envoy)

# ---------------------------------------------------------------------------
# Remote pinning: ipfs-cluster's Pinning Service API (the API `ipfs pin remote`
# speaks), served over TLS by Envoy (k8s/content-pin) on every box under one
# name. Users and passwords are vault_content_pin_users in
# group_vars/ipfs_nodes/vault.yml; scripts/content-pin-token.sh turns one into
# the bearer token a user is given. Must match k8s/content-pin.
# ---------------------------------------------------------------------------
content_pin_hostname: pin.ipni.io
content_pin_port: 9443            # public, TLS
content_pin_admin_port: 9904      # loopback, the pinning Envoy's admin
# Let's Encrypt issuer for the pinning certificate: letsencrypt-prod, or
# letsencrypt-staging to debug issuance without spending production limits.
# Every box gets its own certificate for the same name, so each deploy that
# re-issues spends three of Let's Encrypt's 5 duplicate certificates per week.
content_pin_issuer: letsencrypt-prod
# Shortest password accepted for a pinning user. They are generated (see the
# README), so this only catches a hand-typed one.
content_pin_min_password_length: 32

# Public bootstrap peers the content kubo dials, after this project's own
# bootstrappers (/dnsaddr/bootstrap.ipni.io, one entry per bootstrapper
# instance, added by the role). The same public list the bootstrappers use
# (roles/bootstrap/defaults/main.yml); keep the two in step. The
# bootstrap.libp2p.io Qm identities are ours now, so they come in through the
# role's list rather than this one.
content_public_bootstrap_peers:
  - /ip4/104.131.131.82/tcp/4001/p2p/QmaCpDMGvV2BGHeYERUEnRQAwe3N8SzbUtfsmvsqQLuvuJ
  - /ip4/104.131.131.82/udp/4001/quic-v1/p2p/QmaCpDMGvV2BGHeYERUEnRQAwe3N8SzbUtfsmvsqQLuvuJ

# ---------------------------------------------------------------------------
# Pinset loading. The pinset itself is roles/content/vars/pinset.yml, read on
# every run; these only bound how it is loaded.
# ---------------------------------------------------------------------------
# How long one entry may take to fetch (dag stat) or to reach PINNED on every
# peer, on a ROUTINE run over content that is already well provided. Anything
# that has not answered within two minutes is a fault, not a slow fetch, and a
# long default makes every run drag: this cost is paid on EVERY run by any entry
# that can never complete.
#
# Filling a pinset entry for the first time is a different job, and does not use
# this timeout: scripts/fetch-upstream-entry.sh separates reachability (a fast
# question) from completing a large DAG from one or two dormant peers (a slow
# one). Raise this for a run when something large and slow is genuinely worth
# waiting for: -e content_pin_timeout=3600
content_pin_timeout: 120

# How long to look for an entry's root block before calling it unretrievable.
# Kept short, so a root nobody provides costs minutes, not content_pin_timeout.
content_root_timeout: 300

# Entries larger than this (GB, 10^9 bytes) are skipped and reported, not
# pinned: every pin lands on every box. The size is first estimated from the
# root block alone, so an oversized DAG is never fetched just to measure it;
# entries under the estimate are then measured exactly with `ipfs dag stat`.
content_size_gate_gb: 5

# Explicit per-entry override of the size gate, e.g.
#   -e '{"content_size_gate_allow": ["dist.ipfs.tech"]}'
# dist.ipfs.tech (binary distributions, not a website) estimated ~128 GB on
# 2026-09-15, more than the 100 GiB content-repo claim: resize first.
content_size_gate_allow: []

# Entries in the pinset that are not to be pinned, by name. Never pinned, and
# reported by name on every run. Empty: everything in pinset.yml is in scope.
# (pinset.yml recommends dropping saftproject.com as not an IPFS Project site;
# it is kept because it is tens of MB and was in the upstream list.)
content_pin_exclude: []
