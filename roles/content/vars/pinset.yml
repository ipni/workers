---
# IPFS Project websites pinset for the IPNI content cluster.
#
# HOW THIS IS BUILT
# The upstream collab cluster does not publish a CID list. Its pinset is
# generated by resolving DNSLink for a list of domains and pinning the result
# named after the domain, unpinning the previous version when a site
# republishes. See:
#   https://github.com/ipfs-cluster/archive-tools/blob/master/ipfs-websites/pin-websites.sh
#
# So the DOMAIN is the durable identity; the CID is a snapshot. The `cid` values
# below are what DNSLink returned on 2026-09-15 and will drift as sites publish.
# Resolve fresh at pin time and treat these as a baseline for comparison.
#
# The upstream domain list is from 2019-era infrastructure: of its 28 entries,
# 14 no longer have DNSLink records at all. Those are listed under `retired`
# for the record. Current-era ipfs.tech hosts have been added.
#
# Source page: https://collab.ipfscluster.io/ (IPFS Websites, listed as ~30GB)
# Scope: IPFS Project websites ONLY. Filecoin Params, Project Gutenberg,
# Wikipedia, Pacman.store, Ravencoin and IPFS-search are explicitly out.

# --- BEGIN upstream recovery (scripts/recover-upstream-pinset.sh) ---
# UPSTREAM RECOVERY, 2026-09-16. The IPFS Websites pinset was read from the
# upstream collab cluster by following it (ipfs-cluster-follow ipfs-websites,
# config ipfs-websites.collab.ipfscluster.io, https://collab.ipfscluster.io/).
# That cluster was operated by IPFS Shipyard and no longer exists after
# 2026-09-30; the raw listing captured from it is committed next to this file
# (upstream-pinset-2026-09-16.txt, plus any earlier capture named in
# upstream_listing) and cannot be regenerated.
#
# Upstream had stopped naming pins after the bare domain, as the 2019
# pin-websites.sh did: names now carry a snapshot suffix, e.g.
# "libp2p.io__2024-08-07_220424" or "research.protocol.ai build 3412". The
# newest snapshot per domain is the one recorded; upstream_name says which it
# was, upstream_other_cids keeps the older ones.
#
# `source` on every pinset entry:
#   dnslink           re-resolvable at pin time; `cid` is the 2026-09-15 snapshot.
#                     upstream_cid, when present, is a DIFFERENT CID upstream held
#                     for the same site (drift), named in upstream_name: DNSLink
#                     stays authoritative, the upstream snapshot may be worth keeping.
#   upstream-cluster  NOT re-resolvable: no DNSLink record exists, and the
#                     recorded `cid` is the only remaining copy of the pointer.
# --- END upstream recovery ---

