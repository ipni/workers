# MUST BE SAVED (Molly, 2026-09-15). These sites are wanted in the pinset but
# have no DNSLink record anywhere as of 2026-09-15, including the .tech variants
# suggested (js.ipfs.tech and awesome.ipfs.tech are both dead). They have moved
# off IPFS publishing entirely, so DNS cannot supply their CIDs.
#
# The only remaining source is the upstream collab cluster pinset, which goes
# dark when Shipyard shuts down on 2026-09-30. RECOVER BEFORE THEN:
#
#   ipfs-cluster-follow ipfs-websites run --init ipfs-websites.collab.ipfscluster.io
#   ipfs-cluster-follow ipfs-websites list > upstream-pinset.txt
#
# Upstream pins with --name "$domain", so the listing gives CID plus domain for
# every entry. Sync the pinset first and capture the list; fetching content is a
# separate decision and does not require pulling all ~30GB up front.
#: Checked against the upstream pinset on 2026-09-16: NOT FOUND upstream, so no
#: CID could be recovered for these.
#: js.ipfs.io has since been filled from a copy found outside the upstream
#: listing and moved into `pinset` (2026-09-16). The three below were searched
#: for again in found_upstream_unclassified on 2026-09-16 and are not there
#: either: the only near matches are other sites (ipld-explore, which is
#: already pinned as explore.ipld.io; dnslink-std/dnslink.org, not dnslink.io).
#: All three are still live over HTTPS, so the remaining routes are asking
#: their maintainers to republish DNSLink, or mirroring the live site under a
#: new CID - which would be a new copy, not the original, and needs its own
#: `source`.
# Hand-added pins that were never in `pinset` and have been removed from the
# cluster. Kept here so the decision is reversible and nothing is lost by
# omission.
#: 2026-09-16: both were added by hand during the recovery, retried 60+ times
#: per peer and stayed in PIN_ERROR on all three - blocks of their DAGs have no
#: reachable provider. They are legacy ipfs.io snapshots, already represented
#: by the ipfs.io entries in `pinset`, so they were unpinned rather than
#: adopted. `ipfs-cluster-ctl pin add <cid>` restores either one.
unpinned:
  - name: ipfs.io-legacy
    cid: bafybeih42hd2kjcr7o2f72jinvwotlfn24hppwnfl34lku3665cyp4gipe
    unpinned_on: "2026-09-16"
  - name: ipfs.io-legacy-2
    cid: bafybeidhycjoffkqxrzx3gutcf5quq3tczkikxfsocdayt6o3lzqiqqj4q
    unpinned_on: "2026-09-16"

