# MUST BE SAVED (Molly, 2026-09-15). These sites are wanted in the pinset but
# have no DNSLink record anywhere as of 2026-09-15, including the .tech variants
# suggested (js.ipfs.tech and awesome.ipfs.tech are both dead). They have moved
# off IPFS publishing entirely, so DNS cannot supply their CIDs.
#
# The only remaining source is the upstream collab cluster pinset, which goes
# dark when Shipyard shuts down on 2026-09-30. RECOVER BEFORE THEN:
#
#   ipfs-cluster-follow ipfs-websites run --init ipfs-websites.collab.ipfscluster.io
#   ipfs-cluster-follow ipfs-websites list > upstream-pinset.txt
#
# Upstream pins with --name "$domain", so the listing gives CID plus domain for
# every entry. Sync the pinset first and capture the list; fetching content is a
# separate decision and does not require pulling all ~30GB up front.
#: Checked against the upstream pinset on 2026-09-16: NOT FOUND upstream, so no
#: CID could be recovered for these.
