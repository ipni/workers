---
# needle: Delegated Routing V1 HTTP server, the primary workload on each box.
# Manifests live in k8s/needle (kustomize). This role owns needle's firewall
# ports and the rollout order; shipping and applying are shared via
# roles/kustomize_apply.
#
# FOUR instances per box (needle_instances), each a separate process with its
# own PeerID, concurrency budget and connection pool, behind Envoy's round-robin
# fan-out. See roles/needle/defaults/main.yml for what that is worth.

# ---------------------------------------------------------------------------
# Firewall. Only libp2p is opened; every instance's HTTP API is loopback only.
#
# The ports are fixed in needle_all_instances and in
# k8s/needle/deployment*.yaml, and must be changed in both together.
# ---------------------------------------------------------------------------
- name: Allow needle libp2p traffic (TCP)
  community.general.ufw:
    rule: allow
    port: "{{ item.libp2p }}"
    proto: tcp
    comment: "{{ item.name }} libp2p"
  loop: "{{ needle_running_instances }}"
  loop_control:
    label: "{{ item.name }} {{ item.libp2p }}/tcp"

- name: Allow needle libp2p traffic (UDP - QUIC, WebTransport, WebRTC)
  community.general.ufw:
    rule: allow
    port: "{{ item.libp2p }}"
    proto: udp
    comment: "{{ item.name }} libp2p"
  loop: "{{ needle_running_instances }}"
  loop_control:
    label: "{{ item.name }} {{ item.libp2p }}/udp"

# Lowering needle_instances has to close the ports it opened, or a box keeps
# holes for instances that no longer exist.
- name: Close the libp2p ports of instances that are not running
  community.general.ufw:
    rule: allow
    port: "{{ item.0.libp2p }}"
    proto: "{{ item.1 }}"
    delete: true
  loop: "{{ needle_retired_instances | product(['tcp', 'udp']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.0.libp2p }}/{{ item.1 }}"

# needle used to have a ClusterIP Service. It was removed when the API moved
# to loopback-only: its endpoint (node IP :8190) no longer answers. Removing a
# file from a kustomization does not delete the live object - `kubectl apply`
# does not prune - so delete it explicitly. Safe to keep: absent is a no-op.
- name: Remove the obsolete needle Service
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Service
    name: needle
    namespace: needle
    state: absent

# ---------------------------------------------------------------------------
# Rollout. Every instance's pod template changes together (they share the
# generated env ConfigMap), and each Deployment is `Recreate`, so applying
# without care stops all four at once - the outage this design exists to avoid.
# With needle_rollout_serial (production only) each instance is paused before
# the apply and resumed in turn, so only one is ever down; in dev they all roll
# together, which is a short outage but keeps the edit-deploy loop fast.
#
# Envoy health-checks each instance and ejects one that stops answering, so
# the box keeps serving from the others throughout (verified: with an instance
# scaled to zero, 40/40 requests still returned 200).
# ---------------------------------------------------------------------------
- name: Check which needle deployments exist
  ansible.builtin.command:
    argv: [k3s, kubectl, --namespace=needle, get, deployments, -o, "jsonpath={.items[*].metadata.name}"]
  register: needle_deployments
  changed_when: false
  check_mode: false

- name: Pause every instance but the first, so they do not all roll at once
  ansible.builtin.command:
    argv: [k3s, kubectl, --namespace=needle, rollout, pause, "deployment/{{ item.name }}"]
  loop: "{{ needle_running_instances[1:] }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - needle_rollout_serial | bool
    - not ansible_check_mode
    - item.name in needle_deployments.stdout.split()
  changed_when: false   # a rollout control, not a change to the box

- name: Deploy the needle manifests
  ansible.builtin.include_role:
    name: kustomize_apply
  vars:
    kustomize_app: needle
    kustomize_namespace: needle
    # The rollout this waits for is the first instance's; the rest are paused
    # and are rolled one at a time below.
    kustomize_deployment: "{{ needle_running_instances[0].name }}"
    kustomize_rollout_timeout: "{{ needle_rollout_timeout }}"
    # Deferred to the end of this file. The paused instances still run pods
    # from the old ReplicaSet, which names the old ConfigMap; deleting it now
    # would strand them if one restarted before its turn.
    kustomize_prune_configmaps: false

- name: Delete instances above needle_instances
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.name }}"
    namespace: needle
    state: absent
  loop: "{{ needle_retired_instances }}"
  loop_control:
    label: "{{ item.name }}"

# local-path deletes the volume's data with the claim, which is what retiring
# an instance means: its address book snapshot stops existing too. Both deletes
# are fire-and-forget (wait: false is the default), so a claim may sit in
# Terminating behind its pvc-protection finalizer until the old pod exits; it
# resolves on its own. If wait: true ever lands on one of them, land it on
# both.
- name: Delete the snapshots of instances that are not running
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ item.name }}-data"
    namespace: needle
    state: absent
  loop: "{{ needle_retired_instances }}"
  loop_control:
    label: "{{ item.name }}"

# The first instance was rolled by the apply above; check it the same way
# roll_instance.yml checks the others.
- name: Confirm the first instance's API answers locally
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ needle_running_instances[0].api }}/version"
    return_content: true
  register: needle_version
  retries: 6
  delay: 5
  until: needle_version.status == 200
  when: not ansible_check_mode

- name: Report the running version
  ansible.builtin.debug:
    msg: >-
      needle on {{ inventory_hostname }}: {{ needle_version.content | trim }}
      ({{ needle_running_instances | length }} instance(s):
      {{ needle_running_instances | map(attribute='api') | join(', ') }})
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# Warm-up gate for the FIRST instance. This runs BEFORE the others are rolled,
# not after: a restarted instance answers within a minute but serves badly for
# about an hour, so resuming the second one while the first is still cold would
# leave half the box degraded - exactly what rolling them one at a time exists
# to prevent. The same gate inside roll_instance.yml then separates each later
# instance from the next, and the last one from the next BOX under `serial`.
#
# Only runs when this box's pod actually restarted, so re-running the playbook
# against a settled fleet stays fast.
# ---------------------------------------------------------------------------
- name: Wait for the first instance's address book to warm up
  when:
    - needle_rollout_wait_warm | bool
    - not ansible_check_mode
    - kustomize_deployment_rolled | default(false) | bool
  ansible.builtin.include_tasks: wait_warm.yml
  vars:
    needle_warm_instance: "{{ needle_running_instances[0] }}"

# ---------------------------------------------------------------------------
# One instance at a time: resume it, wait for its pod, prove its API answers,
# and (in production) wait for its address book before touching the next.
# ---------------------------------------------------------------------------
- name: Roll the remaining instances one at a time
  ansible.builtin.include_tasks: roll_instance.yml
  loop: "{{ needle_running_instances[1:] }}"
  loop_control:
    loop_var: needle_instance
    label: "{{ needle_instance.name }}"
  when: not ansible_check_mode

# Deferred from the apply: safe now that every instance runs a pod from the new
# ReplicaSet, so no live pod names the superseded ConfigMap any more.
- name: Prune superseded needle ConfigMaps
  ansible.builtin.include_role:
    name: kustomize_apply
    tasks_from: prune_configmaps
  vars:
    kustomize_app: needle
    kustomize_namespace: needle
