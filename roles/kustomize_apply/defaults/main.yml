---
# Required, set by the including role:
#   kustomize_app         directory name under k8s/ (also the staging prefix)
#   kustomize_namespace   namespace the kustomization targets
#   kustomize_deployment  deployment whose rollout to wait for

# Where manifests are placed on the node before `kubectl apply -k`.
kustomize_dest: "/etc/ipfs-workers/k8s/{{ kustomize_app }}"

# First start pulls the image; later rollouts also wait out preStop drains.
kustomize_rollout_timeout: 600s
