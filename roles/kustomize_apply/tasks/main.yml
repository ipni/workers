---
# Ship k8s/<kustomize_app> to the node, apply it with k3s's kubectl, and wait
# for the rollout. Under --check it performs a real dry run instead.
#
# Results for the including role:
#   kustomize_output             stdout_lines of the apply (or dry run)
#   kustomize_deployment_rolled  true if this run created the deployment or
#                                changed it (a changed pod template rolls the pod)

- name: "Create the manifest directory for {{ kustomize_app }}"
  ansible.builtin.file:
    path: "{{ kustomize_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Ship the {{ kustomize_app }} kustomization"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/k8s/{{ kustomize_app }}/"
    dest: "{{ kustomize_dest }}/"
    owner: root
    group: root
    mode: "0600"

# copy never deletes, so a file removed from k8s/<app>/ would linger on the
# node indefinitely. kustomize only reads listed resources, so a stray file is
# harmless to the build, but the node copy should mirror the repo.
- name: "List the files currently shipped for {{ kustomize_app }}"
  ansible.builtin.find:
    paths: "{{ kustomize_dest }}"
    file_type: file
  register: kustomize_shipped

- name: "Remove files no longer in k8s/{{ kustomize_app }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ kustomize_shipped.files | map(attribute='path')
       | reject('in', lookup('ansible.builtin.fileglob',
                             playbook_dir ~ '/k8s/' ~ kustomize_app ~ '/*', wantlist=True)
                      | map('basename') | map('regex_replace', '^', kustomize_dest ~ '/')
                      | list)
       | list }}

# In check mode the copy above does not run, so the node still holds the OLD
# manifests (or none, on a first deploy). Validating those would prove
# nothing. Instead, stage the repo's manifests in a throwaway temp directory
# and dry-run against that; the real manifest directory is left untouched.
- name: "Check whether the {{ kustomize_namespace }} namespace exists yet"
  ansible.builtin.command:
    argv: [k3s, kubectl, get, namespace, "{{ kustomize_namespace }}", --ignore-not-found, -o, name]
  register: kustomize_ns
  changed_when: false
  check_mode: false

- name: "Dry run {{ kustomize_app }} (check mode only)"
  when: ansible_check_mode
  block:
    - name: Stage the manifests in a temp directory for the dry run
      ansible.builtin.tempfile:
        state: directory
        prefix: "{{ kustomize_app }}-dryrun-"
      register: kustomize_staged
      check_mode: false
      changed_when: false   # throwaway scaffolding, not a change to the host

    - name: Copy the manifests into the dry-run staging directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/k8s/{{ kustomize_app }}/"
        dest: "{{ kustomize_staged.path }}/"
        mode: "0600"
      check_mode: false
      changed_when: false

    # A server-side dry run sends every object through the API server's
    # validation and admission without persisting anything. It cannot handle a
    # first deploy, though: the namespace is only "created" in the dry run, so
    # every object inside it fails with "namespace not found". In that case,
    # fall back to a client-side dry run, which still catches malformed YAML
    # and kustomize errors.
    - name: "Dry run the {{ kustomize_app }} manifests"
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - apply
          - -k
          - "{{ kustomize_staged.path }}"
          - "--dry-run={{ 'server' if kustomize_ns.stdout else 'client' }}"
      # Registered separately from the real apply below: a SKIPPED task still
      # overwrites its registered variable, so sharing one name would erase
      # this output in check mode.
      register: kustomize_dryrun
      check_mode: false
      changed_when: >-
        kustomize_dryrun.stdout_lines
        | reject('search', kustomize_always_configured)
        | select('search', '\\b(created|configured)\\b') | list | length > 0

  always:
    - name: Remove the dry-run staging directory
      ansible.builtin.file:
        path: "{{ kustomize_staged.path }}"
        state: absent
      check_mode: false
      changed_when: false
      when: kustomize_staged.path is defined

- name: "Apply the {{ kustomize_app }} manifests"
  ansible.builtin.command:
    argv: [k3s, kubectl, apply, -k, "{{ kustomize_dest }}"]
  register: kustomize_apply
  changed_when: >-
    kustomize_apply.stdout_lines
    | reject('search', kustomize_always_configured)
    | select('search', '\\b(created|configured)\\b') | list | length > 0
  when: not ansible_check_mode

- name: Record what the apply did
  ansible.builtin.set_fact:
    kustomize_output: "{{ (kustomize_dryrun if ansible_check_mode else kustomize_apply).stdout_lines }}"
    # "configured" means the Deployment object changed. In these manifests the
    # only things that change it are the pod template (image digest, or a
    # generated ConfigMap's hash suffix), and a changed template rolls the pod.
    kustomize_deployment_rolled: >-
      {{ (not ansible_check_mode)
         and (kustomize_apply.stdout is search('deployment[.]apps/' ~ kustomize_deployment ~ ' (created|configured)')) }}

- name: "Show what the {{ kustomize_app }} apply did"
  ansible.builtin.debug:
    var: kustomize_output

- name: "Wait for the {{ kustomize_deployment }} rollout to complete"
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - "--namespace={{ kustomize_namespace }}"
      - rollout
      - status
      - "deployment/{{ kustomize_deployment }}"
      - "--timeout={{ kustomize_rollout_timeout }}"
  changed_when: false
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# Prune superseded generated ConfigMaps, unless the including role defers it.
#
# DEFER IT when the app has more than one Deployment and they are rolled one at
# a time: between the apply and the last resume, the instances still waiting
# run pods from the OLD ReplicaSet, which names the OLD ConfigMap. Pruning it
# then leaves those pods unable to restart (CreateContainerConfigError) until
# their turn comes - hours, with a warm-up gate in between. roles/someguy sets
# kustomize_prune_configmaps: false and includes prune_configmaps.yml itself
# once every instance is back.
# ---------------------------------------------------------------------------
- name: "Prune superseded {{ kustomize_app }} ConfigMaps"
  ansible.builtin.include_tasks: prune_configmaps.yml
  when: kustomize_prune_configmaps | bool
