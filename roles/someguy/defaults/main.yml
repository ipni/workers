---
# ---------------------------------------------------------------------------
# Instances per box
# ---------------------------------------------------------------------------
# Four someguy processes per box, each with its own PeerID, concurrency budget
# and connection pool, behind Envoy's round-robin fan-out.
#
# Measured on sing-1 (2026-09-16, warm, through Cloudflare), achieved rate and
# p50 at each target:
#      target   1 instance          2 instances      4 instances
#      200/s    182/s, 2208ms       194/s, 317ms     198/s,  190ms
#      400/s    352/s, 5014ms       361/s, 2154ms    389/s,  217ms
#      600/s    not reached         530/s, 4489ms    574/s,  467ms
#      850/s    not reached         not reached      775/s, 1964ms
#     1000/s    -                   -                894/s, 3044ms
# One instance also rejected 23,156 background FindPeer lookups per 30s stage;
# four rejected none. Four used 18.2 of 32 cores and 5.5 of 123 GiB.
#
# Lower this to run fewer, and that is the whole change: the Deployments and
# Envoy's endpoint list are both rendered from the table below, so a lowered
# count stops the extra pods being created AND stops Envoy health-checking
# ports that are not there. Instances above the count also have any Deployment
# left over from a previous, higher count deleted and their firewall ports
# closed at the end of every run.
#
# It used to be a half-knob: the extras were created and then deleted moments
# later, and Envoy went on probing the dead ports and logging the failures
# until someone hand-edited k8s/route-origin/envoy.yaml to match. Both of those
# came from the same cause - this table was written out by hand in two other
# files - which is why it is now rendered instead.
someguy_instances: 4

# Name, API port (loopback) and libp2p port (public) of each instance, in
# rollout order.
#
# THE source of truth for the instance layout. roles/kustomize_apply renders
# all three consumers from it:
#   k8s/someguy/deployment.yaml.j2        instance a
#   k8s/someguy/deployment-extra.yaml.j2  instances b onward
#   k8s/route-origin/envoy.yaml.j2        the load-balancer endpoint list
# so a port is written down exactly once. Adding an instance is a line here.
someguy_all_instances:
  - { name: someguy, api: 8190, libp2p: 4004 }
  - { name: someguy-b, api: 8191, libp2p: 4005 }
  - { name: someguy-c, api: 8192, libp2p: 4006 }
  - { name: someguy-d, api: 8193, libp2p: 4007 }

someguy_running_instances: "{{ someguy_all_instances[: someguy_instances | int] }}"
someguy_retired_instances: "{{ someguy_all_instances[someguy_instances | int :] }}"

# Instance a, the one k8s/someguy/deployment.yaml.j2 renders. Named rather than
# indexed inline so the template reads as "the first instance" instead of
# "[0]".
someguy_first_instance: "{{ someguy_all_instances[0] }}"

# First start pulls the image; later rollouts wait for the old pod to stop.
someguy_rollout_timeout: 600s

# ---------------------------------------------------------------------------
# Rollout safety
# ---------------------------------------------------------------------------
# Both halves of what a restart used to throw away are snapshotted to the
# instance's own PVC once the fork image is deployed: the cached address book,
# which otherwise takes about an hour of real traffic to refill, and the
# accelerated DHT client's routing table, which otherwise takes a full crawl -
# minutes - during which every lookup falls back to the standard client. A
# restart with both files present is warm in seconds and serves from the
# accelerated client immediately, on a replayed table, while a fresh crawl runs
# behind it; the only genuinely cold window left is that crawl, and lookups do
# not wait on it.
#
# It is still cold the old way whenever a snapshot is missing or too old: the
# first rollout after either lands, a lost PVC, or an instance down longer than
# the crawl snapshot's max age. With four instances only the one being rolled is
# affected, and Envoy keeps traffic on the other three, so a rollout costs a
# quarter of the box's capacity rather than all of it. The warm gate below is
# satisfied immediately by the address book restore and stays as the safety net
# for those cold starts - which rebuild the way these measurements describe:
#
#   11 minutes after a restart:  p95 2904ms, 2937 rejected FindPeer lookups,
#                                3x the CPU of a warm box
#   69 minutes after a restart:  p95 588-691ms, 0 rejections, warm-box CPU
#
# `serial` alone does not protect against this. A pod goes Ready in about a
# minute, so a serial rollout would still leave every box degraded at once.
# The play has to wait for the box to warm up before moving to the next one,
# which is what this gate does.
#
# Tied to the single production switch (group_vars/ipfs_nodes/main.yml), so it
# is off while these boxes are still a dev fleet and rollouts stay fast. Set
# production_rollout: true - or pass -e production_rollout=true - once they are
# the only boxes serving traffic.
someguy_rollout_wait_warm: "{{ production_rollout | default(false) }}"

# Roll the instances ONE AT A TIME rather than all at once. With four instances
# behind Envoy's health checks, a serial rollout keeps the box serving from the
# other three throughout - but each step waits for the warm gate above, so a box
# takes hours instead of minutes. That is the right trade only once these boxes
# carry traffic, so it rides the same production switch: in dev all four roll
# together and a rollout is over in a couple of minutes.
someguy_rollout_serial: "{{ production_rollout | default(false) }}"

# Peers in the cached address book that count as warm. A settled instance on
# this fleet holds 23k-26k; 15k is comfortably past the painful phase without
# waiting for the last slow arrivals.
#
# Not every instance restores that much. On sing-1 (2026-09-18) someguy,
# someguy-c and someguy-d restored 25507/25190/25295 peers and were over this
# line on the gate's first poll, while someguy-b restored 7798 and had to wait -
# its snapshot is genuinely smaller (6.8 MB against 17 MB on disk), not
# mis-restored. So this poll still does real work and is not dead weight even
# when the snapshots are in place.
someguy_warm_min_peers: 15000

# How long to wait for that, and how often to look. The whole gate is skipped
# when this run did not actually restart the pod.
someguy_warm_timeout_seconds: 3600
someguy_warm_poll_seconds: 60

# Fail the play when a box does not warm up in time, rather than rolling the
# next box on the assumption that this one recovered.
someguy_warm_fail_on_timeout: true

# ---------------------------------------------------------------------------
# What "warm" means, computed from the gate's one scrape
# ---------------------------------------------------------------------------
# roles/someguy/tasks/wait_warm.yml curls the instance's metrics ONCE per poll
# and reduces it to "<address-book-peers> <accelerated-ready>", where the second
# field is 1, 0, or the literal `absent` on a build that does not export
# someguy_dht_accelerated_ready. These three parse that line; they are internal
# to the gate and are not meant to be overridden.
#
# Computed here rather than with set_fact because `until:` re-evaluates them on
# every retry, and because they have to survive being evaluated before the
# first poll has registered anything.
someguy_warm_fields: >-
  {{ ((someguy_warm | default({})).stdout | default('', true)
      | trim | default('0 absent', true)).split() }}
someguy_warm_peers: "{{ someguy_warm_fields[0] | int }}"
someguy_warm_accelerated: "{{ someguy_warm_fields[1] }}"

# An absent accelerated-ready metric counts as satisfied: the older builds on
# the rest of the fleet cannot report it, and holding them to a metric they do
# not have would hang the gate for the full timeout. They stay on the address
# book gate exactly as before.
someguy_warm_is_warm: >-
  {{ (someguy_warm_peers | int) >= (someguy_warm_min_peers | int)
     and someguy_warm_accelerated in ['1', 'absent'] }}
