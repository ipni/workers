---
# Roll ONE someguy instance: resume the rollout the apply left paused, wait for
# its pod, prove its API answers, and (in production) wait for its address book
# before the caller moves to the next one. Included per instance by main.yml
# with someguy_instance set.
#
# The other instances keep serving throughout; Envoy ejects this one while it
# is down and takes it back when /version answers again.

- name: "Resume {{ someguy_instance.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, --namespace=someguy, rollout, resume, "deployment/{{ someguy_instance.name }}"]
  register: someguy_resume
  # Resuming a deployment that was never paused is an error, not a failure:
  # it happens whenever this instance was created by the apply just now.
  failed_when:
    - someguy_resume.rc != 0
    - "'is not paused' not in someguy_resume.stderr"
  changed_when: someguy_resume.rc == 0

- name: "Wait for {{ someguy_instance.name }} to roll out"
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace=someguy
      - rollout
      - status
      - "deployment/{{ someguy_instance.name }}"
      - "--timeout={{ someguy_rollout_timeout }}"
  changed_when: false

- name: "Confirm {{ someguy_instance.name }} answers on 127.0.0.1:{{ someguy_instance.api }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ someguy_instance.api }}/version"
    return_content: true
  register: someguy_instance_version
  retries: 6
  delay: 5
  until: someguy_instance_version.status == 200

- name: "Wait for {{ someguy_instance.name }}'s address book to warm up"
  ansible.builtin.include_tasks: wait_warm.yml
  vars:
    someguy_warm_instance: "{{ someguy_instance }}"
  when: someguy_rollout_wait_warm | bool
