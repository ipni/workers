---
# A standalone single-node k3s cluster per host. These clusters know nothing
# about each other by design - see inventory/hosts.yml for why.

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

# This role installs k3s but never upgrades it: an upgrade must go one minor
# version at a time with a backup at each step, which is k3s-upgrade.yml's job.
# Fail loudly on a mismatch rather than silently running against a different
# version than the one pinned.
- name: Read the installed k3s version
  ansible.builtin.command:
    argv: [k3s, --version]
  register: k3s_installed_version
  changed_when: false
  check_mode: false
  when: k3s_binary.stat.exists

- name: Fail if the installed k3s differs from k3s_version
  ansible.builtin.assert:
    that: k3s_version in k3s_installed_version.stdout
    fail_msg: >-
      {{ inventory_hostname }} runs
      {{ k3s_installed_version.stdout | regex_search('v[0-9.]+[+]k3s[0-9]+') }}
      but k3s_version is {{ k3s_version }}. Upgrade with k3s-upgrade.yml (one
      minor version at a time), then set k3s_version to match.
    quiet: true
  when: k3s_binary.stat.exists

# ---------------------------------------------------------------------------
# Secrets encryption at rest. Secrets hold the bootstrappers' permanent private
# keys, their API tokens and the Envoy origin TLS key; without this they sit in
# plaintext in k3s's SQLite datastore on the OS disk.
#
# A fresh install gets `secrets-encryption: true` in config.yaml from the start.
# An EXISTING cluster must follow k3s's documented single-server procedure
# exactly (https://docs.k3s.io/cli/secrets-encrypt, "Available as of
# v1.33.10+k3s1"); getting it wrong "can leave your cluster permanently
# corrupted":
#   1. secrets-encrypt status shows Disabled
#   2. secrets-encrypt enable
#   3. add secrets-encryption to the config, restart
#   4. secrets-encrypt rotate-keys, wait for reencrypt_finished
#   5. restart
#   6. status shows Enabled
# The steps are split around the config write and restart below.
# ---------------------------------------------------------------------------
- name: Read the secrets encryption status
  ansible.builtin.command:
    argv: [k3s, secrets-encrypt, status]
  register: k3s_encryption_status
  changed_when: false
  check_mode: false
  when: k3s_binary.stat.exists

# Two facts, so an interrupted run resumes instead of repeating a step:
#   k3s_encryption_needs_enable  - never started ("no configuration file found")
#   k3s_enable_encryption        - still Disabled at any point before rotate-keys
#                                  (either never started, or enabled and restarted)
- name: Decide which secrets encryption steps this cluster still needs
  ansible.builtin.set_fact:
    k3s_encryption_needs_enable: >-
      {{ k3s_binary.stat.exists
         and 'no configuration file found' in k3s_encryption_status.stdout }}
    k3s_enable_encryption: >-
      {{ k3s_binary.stat.exists
         and 'Encryption Status: Disabled' in k3s_encryption_status.stdout }}

- name: Enable secrets encryption on the existing cluster (step 2 of 6)
  when:
    - k3s_encryption_needs_enable | bool
    - not ansible_check_mode
  block:
    - name: Create the k3s backup directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s-backups
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Consistent copy of the datastore, CAs and credentials, so a failed
    # procedure can be restored.
    - name: Stop k3s for a consistent backup
      ansible.builtin.systemd:
        name: k3s
        state: stopped

    - name: Back up the k3s server state before enabling encryption
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "/var/lib/rancher/k3s-backups/server-before-encryption-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.gz"
          - -C
          - /var/lib/rancher/k3s
          - server
      changed_when: true

    - name: Start k3s again
      ansible.builtin.systemd:
        name: k3s
        state: started

    - name: Wait for the API server
      ansible.builtin.command:
        argv: [k3s, kubectl, get, --raw, /readyz]
      register: k3s_readyz
      changed_when: false
      retries: 30
      delay: 5
      until: k3s_readyz.rc == 0

    - name: Run secrets-encrypt enable
      ansible.builtin.command:
        argv: [k3s, secrets-encrypt, enable]
      changed_when: true

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Write k3s server configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    owner: root
    group: root
    content: |
      # Managed by Ansible.
      node-name: "{{ inventory_hostname }}"
      # Single-node cluster: sqlite backend, no etcd, no cross-site quorum.
      disable:
      {% for component in k3s_disable_components %}
        - {{ component }}
      {% endfor %}
      # PVCs land on the dedicated NVMe rather than the OS disk.
      default-local-storage-path: "{{ data_mount }}/local-path-provisioner"
      node-label:
        - "site={{ site }}"   # location, for scheduling/selection
      # The API server is not exposed publicly; ufw denies 6443 inbound and
      # remote kubectl reaches it over an SSH tunnel.
      write-kubeconfig-mode: "0600"
      # Encrypt Secrets at rest (AES-CBC). On an existing cluster this is only
      # added as part of the procedure above.
      secrets-encryption: true
  register: k3s_config

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /root/k3s-install.sh
    mode: "0700"
    owner: root
    group: root
  when: not k3s_binary.stat.exists

- name: Install k3s server
  ansible.builtin.command:
    cmd: /root/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  when: not k3s_binary.stat.exists
  changed_when: true

# Also step 3 of the encryption procedure: restart with the new config.
- name: Restart k3s if configuration changed
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - k3s_config is changed
    - k3s_binary.stat.exists

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Finish enabling secrets encryption (steps 4-6 of 6)
  when:
    - k3s_enable_encryption | bool
    - not ansible_check_mode
  block:
    - name: Wait for the API server after the restart
      ansible.builtin.command:
        argv: [k3s, kubectl, get, --raw, /readyz]
      register: k3s_readyz
      changed_when: false
      retries: 30
      delay: 5
      until: k3s_readyz.rc == 0

    # Documented step 4: after enable + restart, status must show encryption
    # still Disabled but at the "start" stage with matching hashes. Anything
    # else means the procedure is off track - stop before rotating keys.
    # The API can report ready before k3s's secrets-encrypt handler serves
    # ("Internal error occurred"), so retry until the status call answers.
    - name: Read the secrets-encrypt status once the handler is serving
      ansible.builtin.command:
        argv: [k3s, secrets-encrypt, status]
      register: k3s_encryption_start
      changed_when: false
      retries: 24
      delay: 5
      until: k3s_encryption_start.rc == 0

    - name: Check the cluster is at the start stage before rotating keys
      ansible.builtin.assert:
        that:
          - "'Encryption Status: Disabled' in k3s_encryption_start.stdout"
          - "'Current Rotation Stage: start' in k3s_encryption_start.stdout"
          - "'All hashes match' in k3s_encryption_start.stdout"
        fail_msg: "Not at the documented start stage; stopping before rotate-keys: {{ k3s_encryption_start.stdout }}"
        quiet: true

    - name: Run secrets-encrypt rotate-keys (re-encrypts every Secret)
      ansible.builtin.command:
        argv: [k3s, secrets-encrypt, rotate-keys]
      changed_when: true

    - name: Wait for re-encryption to finish
      ansible.builtin.command:
        argv: [k3s, secrets-encrypt, status]
      register: k3s_rotation
      changed_when: false
      retries: 60
      delay: 5
      until: k3s_rotation.rc == 0 and 'reencrypt_finished' in k3s_rotation.stdout

    - name: Restart k3s to complete the procedure
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Wait for the API server after the final restart
      ansible.builtin.command:
        argv: [k3s, kubectl, get, --raw, /readyz]
      register: k3s_readyz
      changed_when: false
      retries: 30
      delay: 5
      until: k3s_readyz.rc == 0

- name: Read the final secrets encryption status
  ansible.builtin.command:
    argv: [k3s, secrets-encrypt, status]
  register: k3s_encryption_final
  changed_when: false
  retries: 24
  delay: 5
  until: k3s_encryption_final.rc == 0
  when: not ansible_check_mode

- name: Fail unless secrets encryption is enabled and consistent
  ansible.builtin.assert:
    that:
      - "'Encryption Status: Enabled' in k3s_encryption_final.stdout"
      - "'All hashes match' in k3s_encryption_final.stdout"
    fail_msg: "{{ k3s_encryption_final.stdout }}"
    quiet: true
  when: not ansible_check_mode

# A status line is not proof. files/check_secrets_at_rest.py reads the kine
# table in the SQLite datastore and exits 0 (all current rows ciphertext),
# 1 (a current row still holds plaintext) or 2 (no Secrets yet, as on a fresh
# cluster). Only exit 1 is a problem worth acting on.
#
# Why old_value matters: kine copies the previous value into old_value on every
# write, so right after rotate-keys each Secret's current row still carries its
# old plaintext. Re-applying an unchanged Secret does NOT fix that - the API
# server skips writes of identical objects. A real change (an annotation) is
# needed to create a revision whose value and old_value are both ciphertext.
- name: Check Secrets are encrypted in the datastore
  ansible.builtin.script: files/check_secrets_at_rest.py
  register: k3s_secrets_at_rest
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Write every Secret once more so old_value is ciphertext too
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - annotate
      - secrets
      - --all
      - --all-namespaces
      - --overwrite
      - "ipfs-workers/reencrypted-at={{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - k3s_secrets_at_rest.rc | default(0) == 1

- name: Re-check Secrets are encrypted in the datastore
  ansible.builtin.script: files/check_secrets_at_rest.py
  register: k3s_secrets_recheck
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - k3s_secrets_at_rest.rc | default(0) == 1

# The re-check only runs when the first check found plaintext, so take whichever
# of the two actually ran as the verdict. A skipped task still overwrites its
# registered variable, so `.rc` has to be read defensively.
- name: Settle the Secret encryption verdict
  ansible.builtin.set_fact:
    k3s_secrets_verdict: "{{ k3s_secrets_recheck if 'rc' in k3s_secrets_recheck else k3s_secrets_at_rest }}"
  when: not ansible_check_mode

- name: Report Secret encryption at rest
  ansible.builtin.debug:
    msg: "{{ k3s_secrets_verdict.stdout | trim }}"
  when: not ansible_check_mode

# Exit 1 means a Secret's current row is STILL plaintext after the re-annotate,
# which the comment above says must not happen. Fail loudly rather than leaving
# it in a debug line nobody reads. Exit 2 (no Secrets yet) passes.
- name: Fail unless every current Secret row is encrypted at rest
  ansible.builtin.assert:
    that:
      - k3s_secrets_verdict.rc in [0, 2]
    fail_msg: >-
      Secrets are not encrypted at rest after re-annotating:
      {{ k3s_secrets_verdict.stdout | trim }}
    quiet: true
  when: not ansible_check_mode

# `kubectl wait` fails immediately with "not found" if the node object has not
# registered yet - which is exactly the state just after a fresh install or a
# node rename - so retry around it rather than relying on its own timeout.
- name: Wait for the node to report Ready
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - wait
      - --for=condition=Ready
      - "node/{{ inventory_hostname }}"
      - --timeout=60s
  register: node_ready
  changed_when: false
  retries: 10
  delay: 10
  until: node_ready.rc == 0

# Each cluster is single-node by design, so any other node object is a
# leftover - in practice the old object after a node-name change (the boxes
# were renamed from their location names).
#
# A node is removed when EITHER:
#   - it has this box's own InternalIP: it is this same machine under its old
#     name, so it is certainly stale. This must not wait for NotReady - right
#     after a rename the old object still reports Ready until its lease
#     expires, which is why a NotReady-only rule silently skipped it; or
#   - it is not Ready and has some other IP, i.e. genuinely dead.
# A Ready node on a different IP is never touched.
- name: List node objects with their IP and readiness
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - -o
      - jsonpath={range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}
  register: node_list
  changed_when: false
  check_mode: false

- name: Delete stale node objects
  ansible.builtin.command:
    argv: [k3s, kubectl, delete, node, "{{ item.split()[0] }}"]
  loop: >-
    {{
      node_list.stdout_lines
      | reject('match', '^' ~ (inventory_hostname | regex_escape) ~ ' ')
      | select('match', '^\S+ (' ~ (hostvars[inventory_hostname].ansible_host | regex_escape)
                        ~ ' \S*|\S* (?!True$)\S*)$')
      | list
    }}
  changed_when: true

- name: Wait for core system pods to settle
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=180s
  register: pods_ready
  changed_when: false
  failed_when: false

- name: Read the generated kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_raw

- name: Ensure the local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/kubeconfigs"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

# The server URL is rewritten to localhost because access is via SSH tunnel:
#   ssh -L 6443:127.0.0.1:6443 {{ admin_user }}@{{ ansible_host }}
# k3s names its cluster, user and context all "default". Rename them after the
# box (each box is its own cluster) so the kubeconfigs can be merged into one
# KUBECONFIG without colliding.
#
# This is done as a YAML round-trip rather than a text substitution: the
# cluster/user/context names must stay internally consistent (a context refers
# to its user by name), and a regex that misses one of the several spellings
# silently produces a kubeconfig that prompts for a username instead of
# authenticating. A blanket string replace would also risk corrupting the
# embedded base64 certificate blobs.
- name: Write a per-box kubeconfig locally
  vars:
    kc: "{{ kubeconfig_raw.content | b64decode | from_yaml }}"
  ansible.builtin.copy:
    content: >-
      {{
        kc | combine({
          'clusters': [ kc.clusters[0] | combine({'name': inventory_hostname}) ],
          'users':    [ kc.users[0]    | combine({'name': inventory_hostname}) ],
          'contexts': [ kc.contexts[0] | combine({
                          'name': inventory_hostname,
                          'context': kc.contexts[0].context
                                     | combine({'cluster': inventory_hostname,
                                                'user': inventory_hostname})
                        }) ],
          'current-context': inventory_hostname
        }) | to_nice_yaml(indent=2)
      }}
    dest: "{{ playbook_dir }}/kubeconfigs/{{ inventory_hostname }}.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
