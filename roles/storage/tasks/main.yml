---
# storage_mode picks how this box gets its data volume at data_mount (see
# defaults/main.yml). Imported rather than included, so `--tags storage` reaches
# the tasks inside.
- name: Check storage_mode is one this role knows
  ansible.builtin.assert:
    that: storage_mode in ['ext4_blank_nvme', 'zfs', 'md_xfs']
    fail_msg: "{{ inventory_hostname }}: unknown storage_mode {{ storage_mode }}"
    quiet: true

- name: Provision the blank NVMe as ext4
  ansible.builtin.import_tasks: ext4_blank_nvme.yml
  when: storage_mode == 'ext4_blank_nvme'

- name: Provision ZFS
  ansible.builtin.import_tasks: zfs.yml
  when: storage_mode == 'zfs'

- name: Provision an md array with XFS
  ansible.builtin.import_tasks: md_xfs.yml
  when: storage_mode == 'md_xfs'

# local-path-provisioner resets its root to 0700 whenever it provisions a
# volume. Matching that here stops Ansible and the provisioner flipping the
# mode back and forth on every run, and 0700 is the right value anyway: it
# holds every PVC's data.
- name: Create service data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ data_mount }}/local-path-provisioner", mode: "0700" }
    - { path: "{{ data_mount }}/k3s", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"
