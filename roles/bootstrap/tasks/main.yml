---
# bootstrap: kubo nodes acting as public IPFS/libp2p bootstrap peers (DHT
# server, no content exchange), one per entry of bootstrap_instances: every box
# runs `bootstrap`, and a box may run more (bootstrap-b, ...), each in its own
# namespace with its own identity and ports (group_vars/ipfs_nodes/main.yml).
# Their PeerIDs are permanent: they are published under /dnsaddr and hardcoded
# by clients.

- name: Fail if there is no Cloudflare token for the WSS certificates
  ansible.builtin.assert:
    that: vault_cloudflare_dns_token is defined and vault_cloudflare_dns_token | length > 0
    fail_msg: >-
      vault_cloudflare_dns_token is not set (group_vars/ipfs_nodes/vault.yml).
      cert-manager needs it for the WSS certificates: a Cloudflare API token
      with Zone:DNS:Edit and Zone:Zone:Read on ipni.io.
    quiet: true

# One instance at a time: a failure (a missing identity, an identity change
# without bootstrap_reset_repo) stops before the next instance is touched.
- name: Deploy each bootstrapper instance on this box
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ bootstrap_instances }}"
  loop_control:
    loop_var: bs
    label: "{{ bs.name }} {{ bs.peer_id }}"
  vars:
    bootstrap_namespace: "{{ bs.name }}"
    bootstrap_host: "{{ bs.host }}"
    bootstrap_swarm_port: "{{ bs.swarm_port }}"
    bootstrap_ws_loopback_port: "{{ bs.ws_port }}"
    bootstrap_api_port: "{{ bs.api_port }}"
    bootstrap_wss_port: "{{ bs.wss_port }}"
    bootstrap_wss_admin_port: "{{ bs.wss_admin_port }}"
    bootstrap_kubo_uid: "{{ bs.uid }}"
    bootstrap_instance_peer_id: "{{ bs.peer_id }}"
    # vault_bootstrap_privkey, vault_bootstrap_b_privkey, ... Looked up by
    # name so a missing one is reported by the identity preflight, not here.
    bootstrap_instance_vault_prefix: "vault_{{ bs.name | replace('-', '_') }}"
    bootstrap_instance_privkey: "{{ lookup('ansible.builtin.vars', bootstrap_instance_vault_prefix ~ '_privkey', default='') }}"
    bootstrap_instance_api_token: "{{ lookup('ansible.builtin.vars', bootstrap_instance_vault_prefix ~ '_api_token', default='') }}"
