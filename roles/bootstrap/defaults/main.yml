---
# ---------------------------------------------------------------------------
# Per-instance settings. A box runs one kubo bootstrapper per entry of
# bootstrap_instances (group_vars/ipfs_nodes/main.yml); tasks/main.yml sets
# each of these from that instance's row of bootstrap_instance_table, so the
# values here are the primary instance's, which is also what
# scripts/render-manifests.yml renders. Change ports in the table, not here.
# ---------------------------------------------------------------------------
# Namespace, and the name of the instance: bootstrap, bootstrap-b, ...
bootstrap_namespace: bootstrap

# libp2p swarm port (TCP, and UDP for QUIC / WebTransport / WebRTC-direct).
bootstrap_swarm_port: 4001

# Loopback-only RPC API (probes, metrics, `ipfs` CLI via kubectl exec).
bootstrap_api_port: 5011
bootstrap_api: "/ip4/127.0.0.1/tcp/{{ bootstrap_api_port }}"

# Public bootstrap peers this node dials to join the network: what is left of
# kubo v0.43.1's default list (from its built-in autoconf fallback), pinned
# here because the kubo config disables autoconf - it is fetched from a
# Shipyard-operated URL that may stop after 2026-09-30. The four
# bootstrap.libp2p.io Qm identities are gone from it: this project's
# bootstrappers now hold them, and every instance on the other boxes is
# appended per host by the role. va1 (12D3KooWKnDd...) is dropped as well: its
# key came with the same handover but is not deployed (README "Bootstrap nodes").
bootstrap_public_peers:
  - /ip4/104.131.131.82/tcp/4001/p2p/QmaCpDMGvV2BGHeYERUEnRQAwe3N8SzbUtfsmvsqQLuvuJ
  - /ip4/104.131.131.82/udp/4001/quic-v1/p2p/QmaCpDMGvV2BGHeYERUEnRQAwe3N8SzbUtfsmvsqQLuvuJ

# Public DNS name the bootstrap addresses are published under (/dnsaddr).
bootstrap_dns_name: bootstrap.ipni.io

# ---------------------------------------------------------------------------
# Browser clients: libp2p over secure WebSockets (WSS)
# ---------------------------------------------------------------------------
# Browsers cannot use raw TCP or QUIC, and may only open WebSockets with a
# certificate they trust. Kubo cannot serve its own certificate on /ws, so
# Envoy (k8s/bootstrap-wss) terminates TLS on the public port and forwards
# plain /ws to kubo on loopback. Published as
#   /dns4/<host>.bootstrap.ipni.io/tcp/<wss port>/wss/p2p/<PeerID>
# with <host> the box name plus the instance's suffix (chic-1, chic-1-b).
bootstrap_wss_port: 4443
bootstrap_ws_loopback_port: 4002
# The WSS Envoy's admin port (loopback). 9901 is the route-origin Envoy's.
bootstrap_wss_admin_port: 9902
bootstrap_host: "{{ inventory_hostname }}"
bootstrap_wss_hostname: "{{ bootstrap_host }}.{{ bootstrap_dns_name }}"
bootstrap_ws_listen: "/ip4/127.0.0.1/tcp/{{ bootstrap_ws_loopback_port }}/ws"
bootstrap_wss_announce: "/dns4/{{ bootstrap_wss_hostname }}/tcp/{{ bootstrap_wss_port }}/wss"

# Let's Encrypt issuer for the WSS certificate: letsencrypt-prod or
# letsencrypt-staging. Staging certificates are not trusted by browsers, so the
# WSS address is only announced with prod. Use staging to debug issuance
# without spending production rate limits (5 certificates per name per week).
bootstrap_wss_issuer: letsencrypt-prod

# Optional contact for the Let's Encrypt account (empty: none).
bootstrap_acme_email: ""

# Most concurrent WSS connections accepted from one client address. Kubo sees
# every WSS client as 127.0.0.1 and exempts loopback from its own per-IP
# limits, so this firewall rule is the only per-client cap. Leaves room for
# many browsers behind one NAT address.
bootstrap_wss_max_conns_per_ip: 64

# What counts as "one client" per family. /32 is a single IPv4 address, but the
# IPv6 equivalent is NOT /128: a residential v6 client is handed a /64 or
# larger and can pick a fresh address per connection, so a /128 cap would be
# free to walk around. /64 is the smallest prefix that is reliably one
# subscriber. Raise the mask only if a shared /64 turns out to need it.
bootstrap_wss_connlimit_mask_v4: 32
bootstrap_wss_connlimit_mask_v6: 64

# Relay reservations kubo allows per IP. All WSS clients share 127.0.0.1, so
# kubo's default of 8 would be a limit for every browser combined; this equals
# the total (Swarm.RelayService.MaxReservations, default 128).
bootstrap_relay_max_reservations_per_ip: 128

# The wss address is announced (and checked) only with a browser-trusted certificate.
bootstrap_wss_announced: "{{ bootstrap_wss_issuer == 'letsencrypt-prod' }}"

# kubo's uid (runAsUser), and the owner the firewall rule that keeps it from
# dialing loopback matches on. One per instance, so each gets its own rule.
bootstrap_kubo_uid: 10002

# ---------------------------------------------------------------------------
# Identity changes
# ---------------------------------------------------------------------------
# kubo sets its identity only at `ipfs init`, and the init container refuses a
# repo whose PeerID is not the expected one, so an instance whose running
# PeerID differs from its vaulted one (a changed identity, or a first deploy)
# can only start from an EMPTY repo. The role stops on such an instance unless
# this is true, in which case it deletes the instance's Deployment and its
# kubo-repo PVC (local-path: the data goes with it) before the apply.
#   ansible-playbook bootstrap.yml -l <box> -e bootstrap_reset_repo=true
bootstrap_reset_repo: false
