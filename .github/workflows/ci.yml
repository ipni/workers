---
# The repo's one workflow. Most of it never talks to a box: it catches DRIFT,
# a generated file that no longer matches its generator, a pinned upstream
# manifest that changed under its checksum, a playbook that stopped parsing, a
# pinset section the role does not know about. Every one of those has gone
# unnoticed here before, which is why this exists.
#
# The exception is the playbooks that run from CI: site.yml (the boxes' base:
# packages, sysctls, SSH, firewall, k3s) and platform.yml (Argo CD and the
# monitoring stack's firewall, see the README). For each of them:
#
#   pull request   -> the checks, then a dry run (--check --diff) against the
#                     boxes if the PR touches that playbook
#   merge to main  -> the checks, then, if the merge touches it, a dry run of
#                     the merged commit, then the real run, once a required
#                     reviewer has read the dry run and approved it in the
#                     `production` environment
#   manual         -> the checks, plus optionally a dry run, or a dry run and
#                     an apply, of one playbook, limited to some boxes if wanted
#
# site.yml goes first: platform.yml relies on what it sets up, so when a merge
# touches both, platform.yml's dry run starts only once site.yml's apply is
# done, and shows what is left to change after it.
#
# One workflow, so a merge starts one run. Pull requests from forks get no
# secrets: their dry runs are skipped.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      playbook:
        description: "Playbook to run against the boxes"
        type: choice
        options: [site, platform]
        default: site
      run:
        description: "none (checks only), check (dry run) or apply (dry run, then the approved run)"
        type: choice
        options: [none, check, apply]
        default: none
      limit:
        description: "Boxes to run on (ansible --limit), empty for all"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint and the collections the roles use
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint
          ansible-galaxy collection install community.general ansible.posix kubernetes.core

      # ansible.cfg points vault at .vault_pass, a gitignored credential that
      # does not exist in CI. Nothing here encrypts or decrypts, so a
      # throwaway file is enough to satisfy the config.
      - name: Provide a throwaway vault password file
        run: echo ci > .vault_pass

      # Every playbook, not just site.yml: a role edit can break one of the
      # others and nothing else would say so.
      - name: Syntax-check every playbook
        run: |
          for playbook in site.yml routing.yml bootstrap.yml content.yml k3s-upgrade.yml platform.yml; do
            echo "== $playbook"
            ansible-playbook --syntax-check "$playbook"
          done

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  manifests:
    runs-on: ubuntu-latest
    # ansible.cfg sets stdout_callback to yaml, which no installed collection
    # provides here. A syntax-check never loads stdout callbacks, but this job
    # runs a playbook, so CI renders with the built-in callback instead.
    env:
      ANSIBLE_STDOUT_CALLBACK: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same vault situation as the ansible job: the config names a gitignored
      # file that CI does not have, and nothing here decrypts.
      - name: Provide a throwaway vault password file
        run: echo ci > .vault_pass

      # Some manifests are .j2, rendered on the node by roles/kustomize_apply.
      # Rendering them here through the same playbook a person would use means
      # CI checks what will actually be applied, not a source file that never
      # reaches a box.
      - name: Render the manifest templates
        run: |
          pip install ansible-core
          ansible-playbook scripts/render-manifests.yml -e dest=rendered

      # kustomize build resolves every patch and digest pin, so a manifest that
      # no longer applies fails here rather than half-way through a deploy.
      - name: kustomize build every overlay
        run: |
          for dir in rendered/*/; do
            [ -f "$dir/kustomization.yaml" ] || continue
            echo "== $dir"
            kubectl kustomize "$dir" > /dev/null
          done

      # The instance count is a knob (needle_instances). It is only a real one
      # if the Deployments, their snapshots and Envoy's endpoint list move
      # together, which is the whole point of rendering them from one table.
      - name: needle instance count drives all the manifests
        run: |
          for count in 1 2 4; do
            ansible-playbook scripts/render-manifests.yml \
              -e dest="rendered-$count" -e "needle_instances=$count" > /dev/null
            needle_build=$(kubectl kustomize "rendered-$count/needle")
            deployments=$(printf '%s\n' "$needle_build" | grep -c '^kind: Deployment')
            pvcs=$(printf '%s\n' "$needle_build" | grep -c '^kind: PersistentVolumeClaim')
            endpoints=$(kubectl kustomize "rendered-$count/route-origin" \
                        | grep -c 'port_value: 819')
            echo "needle_instances=$count -> $deployments Deployments, $pvcs PVCs, $endpoints endpoints"
            if [ "$deployments" -ne "$count" ] || [ "$pvcs" -ne "$count" ] || [ "$endpoints" -ne "$count" ]; then
              echo "::error::needle_instances=$count produced $deployments Deployments, $pvcs PVCs and $endpoints Envoy endpoints"
              exit 1
            fi
          done

      # The cert-manager release manifest is vendored, so its checksum is the
      # only thing standing between us and a silently edited copy. The expected
      # value is read out of the kustomization's own comment, so the pin and
      # the check can never disagree.
      - name: cert-manager manifest matches its pinned checksum
        run: |
          pinned=$(awk '/^#[[:space:]]*sha256 /{print $3}' k8s/cert-manager/kustomization.yaml)
          test -n "$pinned" || { echo "no sha256 pinned in kustomization.yaml"; exit 1; }
          echo "$pinned  k8s/cert-manager/cert-manager.yaml" | sha256sum -c -

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml cryptography

      # The bootstrappers' PeerIDs come from these derivations: an Ed25519
      # change would silently move every published ID, and the legacy
      # bootstrap.libp2p.io identities are RSA.
      - name: libp2p_identity.py unit tests
        run: python3 -m unittest scripts/test_libp2p_identity.py

      # dns.txt is generated but committed, and README calls it the source of
      # truth for the live records. It has drifted from its generator before.
      - name: dns.txt matches its generator
        run: |
          python3 scripts/bootstrap-dns.py > /tmp/dns.generated
          diff -u /tmp/dns.generated dns.txt

      - name: dns-libp2p.txt matches its generator
        run: |
          python3 scripts/bootstrap-dns.py --libp2p > /tmp/dns-libp2p.generated
          diff -u /tmp/dns-libp2p.generated dns-libp2p.txt

      # The role ignores - and reports - any pinset.yml section it does not
      # know, which is how a whole section once went unread for a week.
      - name: every pinset.yml section is known to the content role
        run: |
          python3 - <<'PY'
          import re, sys, yaml

          known = re.search(
              r"known_sections:\s*\[([^\]]*)\]",
              open("roles/content/tasks/main.yml").read(),
          )
          if not known:
              sys.exit("could not find known_sections in roles/content/tasks/main.yml")
          known = {s.strip() for s in known.group(1).split(",")}
          present = set(yaml.safe_load(open("roles/content/vars/pinset.yml")))
          unknown = sorted(present - known)
          if unknown:
              sys.exit(f"pinset.yml sections the content role ignores: {unknown}")
          print(f"{len(present)} sections, all known: {sorted(present)}")
          PY

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  # ---------------------------------------------------------------------------
  # Playbooks run from CI: site.yml, then platform.yml
  # ---------------------------------------------------------------------------

  # Whether this run touches what each playbook applies. On a pull request,
  # against where the branch left main, so other merges to main do not count.
  # A manual run picks its playbook itself.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
      platform: ${{ steps.diff.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PLAYBOOK: ${{ inputs.playbook }}
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          set -euo pipefail
          shared='group_vars/|inventory/|ansible\.cfg|scripts/ci-playbook\.sh|\.github/workflows/ci\.yml'
          declare -A paths=(
            [site]="^(site\.yml|roles/(common|hardening|k3s|storage)/|host_vars/|keys/|$shared)"
            [platform]="^(platform\.yml|roles/(argocd|monitoring|ufw_allowlist)/|roles/route_origin/defaults/main\.yml|$shared)"
          )
          if [[ "$EVENT" != workflow_dispatch && "$RANGE" != 0000000000000000000000000000000000000000..* ]]; then
            changed=$(git diff --name-only "$RANGE")
          fi
          for playbook in site platform; do
            if [[ "$EVENT" == workflow_dispatch ]]; then
              hit=$([[ "$PLAYBOOK" == "$playbook" ]] && echo true || echo false)
            elif [[ "$RANGE" == 0000000000000000000000000000000000000000..* ]]; then
              hit=true
            elif grep -qE "${paths[$playbook]}" <<< "$changed"; then
              hit=true
            else
              hit=false
            fi
            echo "$playbook=$hit" | tee -a "$GITHUB_OUTPUT"
          done

  # --- site.yml --------------------------------------------------------------

  # What site.yml would change, for this exact commit: on a merge, this is what
  # the approver reads before approving the apply below. It writes a summary on
  # the run's page. Runs only once every check has passed.
  site-dry-run:
    needs: [ansible, manifests, generated, shell, changes]
    if: >-
      needs.changes.outputs.site == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run != 'none'))
    runs-on: ubuntu-latest
    # On a pull request, a newer push to the same branch replaces its dry run,
    # in a group of its own: GitHub keeps one pending run per group, so sharing
    # the apply's group would let a pull request cancel an apply waiting for
    # approval. On main (and manual runs) it queues with the apply in
    # site-main, so it never runs while an apply is changing the boxes.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('site-check-{0}', github.ref) || 'site-main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # ansible.cfg sets the yaml callback, which no installed collection
      # provides here (see the manifests job).
      ANSIBLE_STDOUT_CALLBACK: default
      ANSIBLE_FORCE_COLOR: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and the collections the roles use
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general ansible.posix kubernetes.core
      - name: Dry run site.yml
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: scripts/ci-playbook.sh site check "$LIMIT"

  # Needs every check and the dry run of this same commit: a commit that fails
  # either is never offered for approval. No status function in `if`, so
  # GitHub adds success().
  #
  # site.yml can lock everyone out (sshd, ufw, the admin keys) or stop k3s, so
  # besides the approval it rolls one box at a time (production_rollout), and
  # after each box proves a fresh SSH login with sudo still works, every key in
  # admin_pubkey_file is still installed and sshd's config is valid. The first
  # box that fails any of that ends the run with the others untouched.
  site-apply:
    needs: [ansible, manifests, generated, shell, changes, site-dry-run]
    if: >-
      needs.changes.outputs.site == 'true' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run == 'apply'))
    runs-on: ubuntu-latest
    # One at a time with main's dry runs, never cancelled half-way. A newer
    # merge waiting behind replaces an older one still waiting for approval:
    # the latest main wins, and its own dry run is the one the approver reads.
    concurrency:
      group: site-main
      cancel-in-progress: false
    # Required reviewers: nothing reaches the boxes until one approves.
    environment: production
    env:
      ANSIBLE_STDOUT_CALLBACK: default
      ANSIBLE_FORCE_COLOR: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and the collections the roles use
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general ansible.posix kubernetes.core
      - name: Run site.yml
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: scripts/ci-playbook.sh site apply "$LIMIT"

  # --- platform.yml ----------------------------------------------------------

  # As site-dry-run, for platform.yml. It waits for site.yml in the same run:
  # a failed or rejected site.yml stops it, since platform.yml relies on what
  # site.yml sets up. Skipped is fine (nothing of site.yml's changed), and so
  # is cancelled: with the run itself not cancelled (!cancelled()), that means
  # a newer merge's site.yml took this one's place in site-main, and this
  # merge's platform.yml change would otherwise never be applied. !cancelled()
  # also means GitHub no longer adds success(), so every check is named.
  platform-dry-run:
    needs: [ansible, manifests, generated, shell, changes, site-dry-run, site-apply]
    if: >-
      !cancelled() &&
      needs.ansible.result == 'success' && needs.manifests.result == 'success' &&
      needs.generated.result == 'success' && needs.shell.result == 'success' &&
      needs.changes.result == 'success' &&
      contains(fromJSON('["success", "skipped", "cancelled"]'), needs.site-dry-run.result) &&
      contains(fromJSON('["success", "skipped", "cancelled"]'), needs.site-apply.result) &&
      needs.changes.outputs.platform == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run != 'none'))
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('platform-check-{0}', github.ref) || 'platform-main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      ANSIBLE_STDOUT_CALLBACK: default
      ANSIBLE_FORCE_COLOR: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and the collections the roles use
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general ansible.posix kubernetes.core
      - name: Dry run platform.yml
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ARGOCD_AGE_KEY: ${{ secrets.ARGOCD_AGE_KEY }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          ARGOCD_REPO_SSH_KEY: ${{ secrets.ARGOCD_REPO_SSH_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: scripts/ci-playbook.sh platform check "$LIMIT"

  # As site-apply, for platform.yml. Its dry run has already waited for
  # site.yml, so this needs only that dry run. Not GitHub's implicit
  # success(): that also counts the dry run's own needs, and site-dry-run and
  # site-apply are skipped on every merge that leaves site.yml alone, which
  # skipped this job too. !cancelled() and the dry run's result instead.
  platform-apply:
    needs: [ansible, manifests, generated, shell, changes, platform-dry-run]
    if: >-
      !cancelled() &&
      needs.platform-dry-run.result == 'success' &&
      needs.changes.outputs.platform == 'true' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run == 'apply'))
    runs-on: ubuntu-latest
    concurrency:
      group: platform-main
      cancel-in-progress: false
    environment: production
    env:
      ANSIBLE_STDOUT_CALLBACK: default
      ANSIBLE_FORCE_COLOR: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and the collections the roles use
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general ansible.posix kubernetes.core
      - name: Run platform.yml
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ARGOCD_AGE_KEY: ${{ secrets.ARGOCD_AGE_KEY }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          ARGOCD_REPO_SSH_KEY: ${{ secrets.ARGOCD_REPO_SSH_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: scripts/ci-playbook.sh platform apply "$LIMIT"
