---
# Three INDEPENDENT single-node k3s clusters.
# Deliberately NOT a stretched cluster: inter-site RTT is 150-250ms, which is
# far outside what etcd's raft timings tolerate reliably. Each host is
# self-contained; geographic redundancy is handled above k8s (DNS/anycast).
#
# Naming: the inventory name is the BOX (hostname, k3s node name, kubeconfig
# context). `site` is the LOCATION, kept separately so a second box in the same
# place (e.g. chic-2) shares a site without sharing an identity.
all:
  children:
    ipfs_nodes:
      hosts:
        sing-1:
          ansible_host: 5.199.165.77
          site: singapore
        lith-1:
          ansible_host: 46.166.169.131
          site: lithuania
        chic-1:
          ansible_host: 84.32.48.211
          site: chicago
