---
# Three INDEPENDENT single-node k3s clusters.
# Deliberately NOT a stretched cluster: inter-site RTT is 150-250ms, which is
# far outside what etcd's raft timings tolerate reliably. Each host is
# self-contained; geographic redundancy is handled above k8s (DNS/anycast).
#
# Naming: the inventory name is the BOX (hostname, k3s node name, kubeconfig
# context). `site` is the LOCATION, kept separately so a second box in the same
# place (e.g. chic-2) shares a site without sharing an identity.
all:
  children:
    ipfs_nodes:
      hosts:
        sing-1:
          ansible_host: 5.199.165.77
          site: singapore
        lith-1:
          ansible_host: 46.166.169.131
          site: lithuania
        chic-1:
          ansible_host: 84.32.48.211
          site: chicago

    # sf and sf2 (the indexers) are ipni/infra's boxes, not ours: Debian, k3s
    # 1.28, a password for sudo, nothing built by site.yml. They are here for
    # cve.yml alone, which is the only playbook that targets this group. Never
    # move them into ipfs_nodes: hardening would replace their SSH keys and
    # turn on ufw, which would cut them off.
    infra_boxes:
      hosts:
        sf:
          ansible_host: 103.232.206.165
        sf2:
          ansible_host: 103.232.206.162

    # Indexers built by this repo: Debian, site.yml and k3s-upgrade.yml only.
    # Not ipfs_nodes, whose membership means bootstrap.yml, content.yml and
    # routing.yml, and whose peers list one another. Not infra_boxes, which is
    # for cve.yml alone. See "Indexer boxes" in the README.
    indexers:
      hosts:
        indexers-chic1:
          ansible_host: 84.32.71.3

    # Every box site.yml and k3s-upgrade.yml manage, and where their shared
    # settings live (group_vars/managed_boxes). Membership is listed here, not
    # by nesting the groups above, because scripts read
    # all.children.ipfs_nodes.hosts directly.
    managed_boxes:
      children:
        ipfs_nodes:
        indexers:
