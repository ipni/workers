# libp2p identity of this box's bootstrapper: the legacy
# ny5.bootstrap.libp2p.io identity. Public: it appears in every /dnsaddr
# record and client bootstrap list, so it must never change. The private key
# is vault_bootstrap_privkey in vault.yml next to this file.
bootstrap_peer_id: QmQCU2EcMqAqQPR2i9bChDtGNJchTbq5TbXJJ16u19uLTa
bootstrap_legacy_name: ny5

# Further kubo instances on this box, each with its own legacy identity.
# Ports come from bootstrap_instance_table (group_vars/ipfs_nodes); the
# key is vault_<name with - as _>_privkey in vault.yml.
#
# bootstrap-b runs the canary for go-libp2p v0.52.0, the first release with the
# fix for the kubo inbound-slot leak (libp2p/go-libp2p#3564): the same image as
# sing-1's content node (see host_vars/sing-1/content.yml), ipfs/kubo v0.43.1
# rebuilt on go-libp2p v0.52.0. From 2026-11-11 to 2026-11-16 it ran v0.43.1
# plus only the fix and leaked nothing. bootstrap on this box, the same
# traffic on the same box, stays on upstream v0.43.1 as its control. Remove
# kubo_image once the role default has the fix, or if the canary misbehaves,
# and re-run bootstrap.yml -l chic-1.
bootstrap_extra_instances:
  - name: bootstrap-b
    peer_id: QmNnooDu7bfjPFoTZYxMNLWUQJyrVwtbZg5gBMjTezGAJN
    legacy_name: sv15
    kubo_image:
      name: ghcr.io/ipni/kubo
      digest: sha256:71d7b748f567865787543119c773512a27536f9e0537c90e7dd1bd12ab153df1
