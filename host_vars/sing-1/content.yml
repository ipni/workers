content_kubo_peer_id: 12D3KooWDkwTCdWYVxnZCq6VYWsNjAGakCrqm7Zx3G2RSTR6dbsj

# Canary for go-libp2p v0.52.0, the first release with the fix for the kubo
# inbound-slot leak (libp2p/go-libp2p#3564, fixed by #3568). No kubo release
# uses it yet: v0.43.1 replaces go-libp2p with lidel/go-libp2p@9c4ee60 (v0.49
# plus a quic-go bump), so this image is ipfs/kubo v0.43.1 (acc53c0) built by
# kubo's own Dockerfile with that replace pointed at go-libp2p v0.52.0 and
# go mod tidy. That also raises shared dependencies (quic-go 0.62 -> 0.64.1,
# golang.org/x/*, prometheus client_golang 1.25); Go 1.26.5, the build
# settings and the version string (0.43.1-acc53c0) match upstream. amd64 only,
# pushed by hand on 2026-11-16 as v0.43.1-libp2p-v0.52.0.
#
# From 2026-11-11 to 2026-11-16 this box ran v0.43.1 plus only the #3568 fix
# (sha256:44f66498...) and leaked nothing while lith-1 and chic-1 leaked
# 700-800 slots a day. lith-1 and chic-1 stay on upstream v0.43.1 as the
# control. Once this has run cleanly, the role default moves to it for every
# box; remove it here then, or if it misbehaves, and re-run
# content.yml -l sing-1.
content_kubo_image:
  name: ghcr.io/ipni/kubo
  digest: sha256:71d7b748f567865787543119c773512a27536f9e0537c90e7dd1bd12ab153df1
