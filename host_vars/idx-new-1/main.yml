# Placeholder box: site.yml refuses to build it until both of these are decided.
site: undecided           # the location, for the site= node label

# ext4_blank_nvme: the single blank NVMe, ext4 at data_mount, as on ipfs_nodes.
# zfs: the pools below. Disks by /dev/disk/by-id only. An existing pool is never
# recreated, and a disk carrying any signature stops the run.
storage_mode: undecided

