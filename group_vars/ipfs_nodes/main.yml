---
# The IPFS boxes' own settings. What they share with every other box this repo
# builds (admin user, SSH, firewall, storage, k3s, sysctls) is in
# group_vars/managed_boxes/main.yml.
# ---------------------------------------------------------------------------
# Rollout mode
# ---------------------------------------------------------------------------
# false (dev): playbooks roll every box at once, which is fastest to iterate on.
# true (production): one box at a time, and needle's rollout waits for each box
# to rebuild the state a restart throws away before the next one is touched.
#
# This governs site.yml, routing.yml, bootstrap.yml, content.yml and
# k3s-upgrade.yml, via the `serial:` expression each of them carries. site.yml
# has no warm-up to wait for, but it does touch sshd, ufw and k3s, so it goes
# one box at a time and stops at the first box that fails or loses SSH access.
# `rollout_serial` overrides the batch size on its own if needed.
#
# Every box is a whole site behind its own hostname with no failover between
# them, so once these are the only boxes serving traffic, a simultaneous
# rollout is a full outage - and needle stays degraded for tens of minutes
# after a restart, long after its pod reports Ready. Measured at 200 req/s:
# 11 minutes in, p95 2904ms with 2937 rejected lookups and 3x the CPU; by 69
# minutes, p95 588-691ms, no rejections, warm CPU.
#
# The boxes are live (delegated-ipfs.dev load-balances onto them), so this is
# true: a plain run rolls one box at a time and waits for each to warm up,
# roughly an hour per box, which is the real cost of restarting needle. Pass
# -e production_rollout=false only for a box that carries no traffic.
production_rollout: true

# ---------------------------------------------------------------------------
# Bootstrappers (bootstrap.yml)
# ---------------------------------------------------------------------------
# Every box runs the primary instance, `bootstrap`; a box whose host_vars list
# bootstrap_extra_instances runs those too, each in its own namespace with its
# own identity (vault_<name, - as _>_privkey and _api_token). Ports, the kubo
# uid and the WSS hostname suffix come from the instance's row here, so every
# consumer - the role, its manifests, the peering check, the content role and
# scripts/bootstrap-dns.py - reads one table. A new row needs its ports added
# to net.ipv4.ip_local_reserved_ports above. uid 10003 is the content kubo's.
bootstrap_instance_table:
  bootstrap: {swarm_port: 4001, ws_port: 4002, api_port: 5011, wss_port: 4443, wss_admin_port: 9902, uid: 10002, suffix: ""}
  bootstrap-b: {swarm_port: 4011, ws_port: 4012, api_port: 5012, wss_port: 4453, wss_admin_port: 9903, uid: 10004, suffix: "-b"}

# This box's instances, in order, each its table row plus name, peer_id and
# host (the DNS label under bootstrap.ipni.io: the box name plus the suffix).
# Read from other hosts as hostvars[h].bootstrap_instances.
bootstrap_instances: >-
  {%- set out = [] -%}
  {%- for i in [{'name': 'bootstrap', 'peer_id': bootstrap_peer_id | default(none),
                 'legacy_name': bootstrap_legacy_name | default(none)}]
               + (bootstrap_extra_instances | default([])) -%}
    {%- set _ = out.append(i | combine(bootstrap_instance_table[i.name],
                                       {'host': inventory_hostname ~ bootstrap_instance_table[i.name].suffix})) -%}
  {%- endfor -%}
  {{ out }}

# ---------------------------------------------------------------------------
# Argo CD and monitoring (platform.yml)
# ---------------------------------------------------------------------------
# One Argo CD, on argocd_hub, deploys the monitoring stack in ipni/infra to
# every box. It reaches the other boxes' API servers directly, so roles/argocd
# opens 6443 on them to argocd_hub's address and nothing else. The trade-off:
# argocd_hub holds a cluster-admin token for every box, so a compromise of it
# reaches all of them. The monitoring hub (Prometheus, Loki, Alertmanager,
# Grafana) runs on the same box, behind Traefik on :8443.
argocd_hub: lith-1

# Runs Healthchecks, the dead-man's switch for the hub: Alertmanager on
# argocd_hub pings it every minute, and it alerts when the pings stop. Must not
# be argocd_hub, or it would go down with the thing it watches.
healthchecks_host: sing-1

# The name each box has in Argo CD, and so in the `cluster` label on every
# metric and log line. ipni/infra refers to the boxes by these names.
argocd_cluster_name: "{{ inventory_hostname | replace('-', '') }}"
