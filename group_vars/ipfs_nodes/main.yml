---
# ---------------------------------------------------------------------------
# Admin account
# ---------------------------------------------------------------------------
# The non-root account that replaces root SSH access. Its authorized_keys is
# the ONLY way in over the network once hardening completes; the provider
# KVM/web console is the designated out-of-band fallback.
admin_user: ipni
admin_pubkey_file: ~/.ssh/id_ed25519.pub

# ---------------------------------------------------------------------------
# SSH hardening
# ---------------------------------------------------------------------------
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_allow_users: "{{ admin_user }}"

# ---------------------------------------------------------------------------
# Firewall (default deny inbound)
# ---------------------------------------------------------------------------
# Base-prep ports only. Service ports (IPFS swarm, HTTP ingress) get opened by
# the per-service playbooks in the next pass, so we are not exposing surface
# for workloads that do not exist yet.
#
# The k3s API server (6443) is deliberately absent from this list: it stays
# closed to the internet and remote kubectl goes over an SSH tunnel (see
# scripts/kubectl-tunnel.sh). This list is the only switch - there is no
# separate "expose the API" flag.
firewall_allowed_tcp:
  - "{{ ssh_port }}"
firewall_allowed_udp: []

# ---------------------------------------------------------------------------
# Rollout mode
# ---------------------------------------------------------------------------
# false (dev): playbooks roll every box at once, which is fastest to iterate on.
# true (production): one box at a time, and someguy's rollout waits for each box
# to rebuild the state a restart throws away before the next one is touched.
#
# Every box is a whole site behind its own hostname with no failover between
# them, so once these are the only boxes serving traffic, a simultaneous
# rollout is a full outage - and someguy stays degraded for tens of minutes
# after a restart, long after its pod reports Ready. Measured at 200 req/s:
# 11 minutes in, p95 2904ms with 2937 rejected lookups and 3x the CPU; by 69
# minutes, p95 588-691ms, no rejections, warm CPU.
#
# Flip this to true when the boxes go live. A production rollout then takes
# roughly an hour per box, which is the real cost of restarting someguy.
production_rollout: false

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# Each host has a second, blank ~894 GiB NVMe. It becomes the dedicated data
# volume so IPFS blockstores never compete with the OS disk. The device name
# differs per host, so the storage role detects it by shape rather than name.
data_mount: /data

# ---------------------------------------------------------------------------
# k3s
# ---------------------------------------------------------------------------
k3s_version: v1.36.4+k3s1   # stable channel, checked 2026-09-15; upgrade with k3s-upgrade.yml

# Traefik is disabled: we will choose an ingress deliberately when the services
# land, rather than inheriting k3s's default. servicelb/local-path are kept.
k3s_disable_components:
  - traefik

# ---------------------------------------------------------------------------
# Kernel tuning for IPFS/libp2p workloads
# ---------------------------------------------------------------------------
# libp2p nodes hold very large numbers of concurrent connections and rely
# heavily on UDP (QUIC), so the stock Ubuntu defaults are too small.
sysctl_tuning:
  fs.file-max: 2097152
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 8192
  net.core.rmem_max: 7500000
  net.core.wmem_max: 7500000
  net.core.somaxconn: 4096
  net.ipv4.tcp_max_syn_backlog: 8192
  net.ipv4.ip_local_port_range: "1024 65535"
  # Host-network listeners that sit INSIDE the ephemeral range above. Without
  # this, any outbound socket (someguy's DHT crawl alone opens ~800) can be
  # handed one of these numbers as its source port; a pod restarting under
  # `Recreate` then fails to re-bind with "address already in use".
  # Reserving only stops the kernel choosing them for outbound connections;
  # explicit binds still work. Update when a host-network port is added:
  #   443 Envoy (outside the range today, kept for safety)
  #   4001 bootstrapper libp2p  4002 bootstrapper /ws (loopback)
  #   4004-4007 someguy libp2p (four instances)  4101 content kubo libp2p
  #   4443 bootstrapper WSS (Envoy)  5011 bootstrapper API
  #   5021 content kubo RPC API (loopback)
  #   6443-6444 k3s API  8190-8193 someguy APIs (loopback, four instances)
  #   8472/udp flannel VXLAN
  #   9094 content ipfs-cluster REST API (loopback)
  #   9095 content ipfs-cluster IPFS proxy (loopback)
  #   9096 content ipfs-cluster swarm
  #   9901 route-origin Envoy admin  9902 bootstrap-wss Envoy admin
  #   10010 containerd  10248-10259 kubelet/kube-proxy/k3s
  net.ipv4.ip_local_reserved_ports: "443,4001-4002,4004-4007,4101,4443,5011,5021,6443-6444,8190-8193,8472,9094-9096,9901-9902,10010,10248-10259"
  net.ipv4.tcp_fin_timeout: 15
  # Must equal what k3s's kube-proxy sets on every start: max(32768 * CPUs,
  # 131072), i.e. 1048576 on these 32-core boxes. A fixed lower value both
  # flapped against k3s on each restart and cut the conntrack table to a
  # quarter of what Kubernetes itself chose for this hardware.
  net.netfilter.nf_conntrack_max: "{{ [32768 * (ansible_processor_vcpus | int), 131072] | max }}"
  vm.max_map_count: 262144

nofile_limit: 1048576
