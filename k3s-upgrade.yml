---
# Upgrade k3s on the boxes, one minor version at a time (k3s and Kubernetes do
# not support skipping minors). Each box walks the path in order and skips
# versions it has already reached, so re-running resumes. production_rollout
# decides whether the boxes upgrade together or one at a time; with it true,
# only one control plane is down at any point.
#
#   ansible-playbook k3s-upgrade.yml
#   ansible-playbook k3s-upgrade.yml -l chic-1
#
# Every step backs up /var/lib/rancher/k3s/server to /var/lib/rancher/k3s-backups
# first. The path itself lives in group_vars/ipfs_nodes/main.yml beside
# k3s_version, so one file records both the target and the route to it; the
# last entry there must equal k3s_version. The assert below enforces that.

- name: Upgrade k3s
  hosts: ipfs_nodes
  serial: >-
    {{ rollout_serial | default(1 if (production_rollout | default(false) | bool)
       else (groups['ipfs_nodes'] | length)) }}
  remote_user: "{{ admin_user }}"
  become: true
  gather_facts: false
  tasks:
    # An upgrade that ends anywhere other than k3s_version would leave the
    # fleet on a version site.yml then tries to change back on its next run.
    - name: Fail unless the upgrade path ends at k3s_version
      ansible.builtin.assert:
        that: k3s_upgrade_path[-1] == k3s_version
        fail_msg: >-
          k3s_upgrade_path ends at {{ k3s_upgrade_path[-1] }} but k3s_version is
          {{ k3s_version }}; both are in group_vars/ipfs_nodes/main.yml.
        quiet: true
      run_once: true

    - name: Walk the upgrade path
      ansible.builtin.include_role:
        name: k3s
        tasks_from: upgrade_hop
      loop: "{{ k3s_upgrade_path }}"
      loop_control:
        loop_var: k3s_hop_version
