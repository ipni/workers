---
# The gateway origin's certificate for envoy.yaml, as a file-based SDS resource.
# The files come from the content-gateway-tls Secret that cert-manager writes. Envoy
# watches the directory: kubelet swaps a renewed Secret in with an atomic
# rename there.
resources:
  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: gw_cert
    tls_certificate:
      certificate_chain: { filename: /etc/envoy/tls/tls.crt }
      private_key: { filename: /etc/envoy/tls/tls.key }
      watched_directory: { path: /etc/envoy/tls }
