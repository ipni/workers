---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TLS in front of the content node's read-only kubo gateway (k8s/content), in the
# content namespace next to the Certificate whose Secret it mounts. A separate
# Deployment from the content node, so proxy changes do not restart it.
namespace: content

resources:
  - deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/name: content-gateway
      app.kubernetes.io/part-of: ipfs-workers

# Same Envoy as k8s/route-origin and k8s/bootstrap-wss: envoyproxy/envoy
# distroless-v1.39.6 (2026-10-27), pinned by index digest.
images:
  - name: envoy
    newName: envoyproxy/envoy
    digest: sha256:1cac8b3a2f72d5a0918f54d7b49e68aae0b0ba325c2d50c8a9a3fff7a4d1f994

configMapGenerator:
  - name: content-gateway-envoy-config
    behavior: create
    files:
      - envoy.yaml
      - sds.yaml

# The certificate Secret (content-gateway-tls) is NOT here: cert-manager writes it
# from the Certificate that roles/content creates per box.
