---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: someguy

resources:
  - namespace.yaml
  # Both are RENDERED from someguy_all_instances (roles/someguy/defaults) by
  # roles/kustomize_apply; the repo holds deployment.yaml.j2 and
  # deployment-extra.yaml.j2. The names below are what lands on the node.
  - deployment.yaml
  # Instances b onward. Four someguy processes per box, each with its own
  # PeerID, concurrency budget and connection pool; Envoy fans out across them
  # (k8s/route-origin/envoy.yaml.j2). Measured on sing-1 2026-09-16: one
  # instance topped out at 355 req/s with p50 5004ms at 400 req/s, four reached
  # 894 req/s with p50 217ms at 400 - see README, "Capacity". At
  # someguy_instances: 1 this renders to a comment, which kustomize accepts as
  # an empty resource.
  - deployment-extra.yaml
  # RENDERED from someguy_running_instances: one per instance, the volume
  # behind the data mount (see deployment.yaml.j2).
  - pvc.yaml

labels:
  - pairs:
      app.kubernetes.io/name: someguy
      app.kubernetes.io/part-of: ipfs-workers

# TEMPORARY: a LOCAL build, not a registry image. This is the someguy fork
# branch (claude/dht-crawl-snapshot-htnvck) carrying the DHT crawl snapshot and
# the kad-dht fork pin the snapshot below needs. It is not published anywhere,
# so there is no digest to pin: a tarball that was `docker save`d and
# `ctr import`ed does not reliably keep the digest buildx computed, and writing
# one here would assert a guarantee nothing checks.
#
# What replaces the digest pin, since the "every box runs byte-identical
# images" property still has to come from somewhere:
#   * ONE build, on the controller, never per box (three builds = three
#     different images wearing the same tag);
#   * one `docker save` tarball, checksum-verified after the copy:
#     sha256:b2e410df607ac60f4bce344065eaeecd6d79b13cf4de0e02ae15b243b84bf442
#   * `k3s ctr images import`, and `k3s ctr images ls` showing
#     sha256:09e1c4f7bc96ebeb2c71d9bde2052f0de0c37ed884ae28815efed5d159ae90d9
#     on every box it was imported to. That digest is the per-box check.
#
# IMPORTED ON: sing-1 only (2026-09-17), so the fleet is deliberately mixed
# while this is verified.
#
# The other two boxes are NOT on the v0.16.0 digest this block used to pin, and
# were not put there by this repo: lith-1 and chic-1 are both serving
# ghcr.io/ipni/someguy:snapshot-test (by tag, not digest), which reports
# `v0.16.0 2026-09-16-7fa75e8`. That build carries the cached ADDRESS BOOK
# snapshot but not the DHT crawl snapshot - it exports no someguy_dht_crawl_*
# metrics and no someguy_dht_accelerated_ready - and their live ConfigMap sets
# SOMEGUY_CACHED_ADDR_BOOK_SNAPSHOT_INTERVAL=2m against the 15m below. Treat
# those boxes as drifted from this repo and reconcile them deliberately;
# re-pinning them is not part of this change.
#
# Therefore: deploy with `-l <box>`, only to a box the image was imported to,
# and import BEFORE applying this. A box without the import cannot pull
# `someguy:<tag>` from anywhere and goes ImagePullBackOff on all four
# instances.
#
# THIS BRANCH MUST NOT REACH main WHILE THE IMAGE IS LOCAL. It is safe as an
# unmerged branch and an outage as main, where a fleet-wide routing.yml run
# would reach the two boxes without the import. Publishing the image to
# ghcr.io/ipni/someguy and restoring a digest pin here is the prerequisite for
# merging, and is a separate piece of work.
#
# No imagePullPolicy is set deliberately: a non-`latest` tag already defaults
# to IfNotPresent, which is what is wanted, and hardcoding `Never` in the
# Deployment templates would have to be remembered and undone when the image
# goes back to a registry.
images:
  - name: someguy
    newName: someguy
    newTag: dht-crawl-snapshot-20260917

configMapGenerator:
  - name: someguy-env-vars
    behavior: create
    literals:
      # Loopback only. Under hostNetwork this is the HOST's loopback, which is
      # exactly where its one client lives: the route-origin Envoy proxy (also
      # hostNetwork). The API is therefore unreachable from any interface even
      # if ufw were disabled or misconfigured - it does not rely on the
      # firewall. The public path is Cloudflare -> Envoy :443 -> here.
      #
      # The PORT here is a fallback that nothing uses: every Deployment sets
      # SOMEGUY_LISTEN_ADDRESS in its own `env:` (container `env` wins over
      # `envFrom`), because the four instances need four different ports. The
      # address is kept here so the loopback-only decision stays documented in
      # one place, and so a new instance that forgot its override would still
      # not be able to listen on a public interface.
      - SOMEGUY_LISTEN_ADDRESS=127.0.0.1:8190

      # Accelerated DHT plus the autoconf `auto` endpoints (cid.contact for
      # providers). These boxes must never become an upstream of cid.contact,
      # or provider lookups would loop.
      - SOMEGUY_DHT=accelerated
      - SOMEGUY_PROVIDER_ENDPOINTS=auto
      - SOMEGUY_PEER_ENDPOINTS=auto
      - SOMEGUY_IPNS_ENDPOINTS=auto

      # The autoconf cache and the address book snapshot live here; there is
      # still no identity or datastore.
      - SOMEGUY_DATADIR=/data/someguy

      # Providers or peers per `Accept: application/json` response. The HTTP
      # Routing v1 spec recommends 100 (someguy's default); 50 still gives a
      # client plenty of providers to try.
      #
      # Measured on sing-1 at 200 req/s, warm, 2026-09-16: dropping this to 25
      # halved p50 (2208ms -> 1180ms) and cut response bytes ~70%. someguy's
      # CPU and p95 did not move, so the gain is in building and shipping the
      # response, NOT in fewer provider-address lookups - the tail is still
      # bounded by DHT walks (see README, "Capacity: four someguy instances
      # per box"). 50 is the compromise: most of a measured gain, half the
      # loss in completeness. 25 is what was measured; 50 is interpolation.
      - SOMEGUY_RECORDS_LIMIT=50

      # Background FindPeer lookups for provider records that arrive without
      # addresses. The default (512) is reached under load: a rate test at
      # 200 req/s on sing-1 rejected 7809 of them while someguy used only 5.5
      # of 32 cores, so the cap - not CPU - was the limit. Rejected lookups
      # mean provider records returned without addresses.
      - SOMEGUY_CACHED_ADDR_BOOK_MAX_CONCURRENT_FIND_PEERS=2048

      # Snapshot the address book to the volume every 15 minutes, plus once on
      # a clean shutdown. The periodic write is the guarantee: an OOM kill
      # skips shutdown, so the interval bounds what a crash can lose. Needs the
      # fork image (see the images block above); inert on the upstream one.
      - SOMEGUY_CACHED_ADDR_BOOK_SNAPSHOT_INTERVAL=15m

      # Snapshot the accelerated client's routing table to the same volume, as
      # dht-crawl.ndjson (10k-25k peers with their public addresses, a few MB),
      # and replay it at start when the file is younger than this. It is
      # written after every completed crawl and at no other time - not on a
      # timer, not at shutdown - because the table only changes when a crawl
      # completes. A replay triggers a fresh crawl the moment the replayed
      # table is in place, so the table is stale only by the last crawl plus
      # the downtime. A file older than the max age is ignored, not deleted;
      # the next completed crawl overwrites it.
      #
      # 2h: past two crawl intervals of drift, crawling from cold is the safer
      # start than replaying a table that has moved on.
      #
      # Requires an image carrying BOTH the snapshot code and the kad-dht fork
      # someguy pins for fullrt.WithRouteTableFilter - see the images block
      # above. Enabling it against an image without that fork is not merely
      # inert: the replay runs and reports its peers, fullrt's default filter
      # drops every one of them for having no open connection, and the
      # instance comes up with an EMPTY routing table while
      # someguy_dht_crawl_snapshot_restored_peers reads 15k+. Gate on
      # someguy_dht_accelerated_ready, never on that gauge.
      - SOMEGUY_DHT_CRAWL_SNAPSHOT_MAX_AGE=2h

      # The libp2p resource manager defaults to 85% of HOST RAM and ignores the
      # cgroup limit, which would let it plan past the pod's 21Gi and get
      # OOM-killed. 16 GiB, in bytes: a quarter of the 64 GiB the single
      # instance was given, as there are now four of them.
      - SOMEGUY_LIBP2P_MAX_MEMORY=17179869184

      # Soft Go heap target below the 21Gi container limit, so the GC works
      # harder before the kernel OOM-kills the pod. Each instance actually
      # holds about 1.5 GiB under load; this is headroom, not a forecast.
      - GOMEMLIMIT=20GiB

      - GOLOG_LOG_LEVEL=error,someguy=info
      - GOLOG_LOG_FMT=json
