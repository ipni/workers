# Instances b, c and d: identical to k8s/someguy/deployment.yaml (instance a)
# except for the name and the two ports each one owns. Every comment explaining
# why the pod looks like this lives in that file; this one is deliberately
# mechanical, so the four stay in step.
#
#   instance   API (loopback)   libp2p (public)
#   someguy    8190             4004
#   someguy-b  8191             4005
#   someguy-c  8192             4006
#   someguy-d  8193             4007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: someguy-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: someguy-b
  template:
    metadata:
      labels:
        app: someguy-b
    spec:
      hostNetwork: true
      dnsPolicy: Default
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: someguy
          image: someguy
          envFrom:
            - configMapRef:
                name: someguy-env-vars
          env:
            - name: SOMEGUY_LISTEN_ADDRESS
              value: 127.0.0.1:8191
            - name: SOMEGUY_LIBP2P_LISTEN_ADDRS
              value: /ip4/0.0.0.0/tcp/4005,/ip4/0.0.0.0/udp/4005/quic-v1,/ip4/0.0.0.0/udp/4005/webrtc-direct,/ip4/0.0.0.0/udp/4005/quic-v1/webtransport,/ip6/::/tcp/4005,/ip6/::/udp/4005/quic-v1,/ip6/::/udp/4005/webrtc-direct,/ip6/::/udp/4005/quic-v1/webtransport
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
            - name: libp2p-tcp
              containerPort: 4005
              protocol: TCP
            - name: libp2p-udp
              containerPort: 4005
              protocol: UDP
          resources:
            requests:
              cpu: "6"
              memory: 20Gi
            limits:
              memory: 21Gi
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /version
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data/someguy
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
