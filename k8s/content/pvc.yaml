---
# Shared by both containers: kubo's repo (blocks of the pinned website
# content, datastore) under ipfs/, and ipfs-cluster's state (CRDT pinset,
# identity, peerstore) under ipfs-cluster/. Nothing enforces the size:
# local-path ignores it, and kubo's Datastore.StorageMax is only the automatic
# GC threshold (GC is not enabled and never removes pinned blocks). What is
# pinned - on every box - is the only bound; check sizes before pinning.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: content-repo
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
