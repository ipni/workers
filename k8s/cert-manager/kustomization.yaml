---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cert-manager v1.21.2 (released 2026-09-11; supports Kubernetes 1.33-1.36),
# the unmodified release manifest:
#   https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
#   sha256 e03b668ec8675214af6b0a671699d088f2601fa3878e0dbe1b41d3feafd1879f
# To upgrade: replace the file, update the digests below, re-run bootstrap.yml.
#
# Used for the bootstrappers' WSS certificates (Let's Encrypt, DNS-01 through
# Cloudflare). Issuers and Certificates are created per box by roles/bootstrap.
resources:
  - cert-manager.yaml

# Only part-of: the release manifest's own app.kubernetes.io/name labels
# (cainjector, webhook, ...) are left as they are.
labels:
  - pairs:
      app.kubernetes.io/part-of: ipfs-workers

# Multi-arch index digests of the v1.21.2 tags on quay.io. The acmesolver image
# (named in a controller flag, so not rewritten here) only runs for HTTP-01
# challenges, which nothing here uses.
images:
  - name: quay.io/jetstack/cert-manager-controller
    digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
  - name: quay.io/jetstack/cert-manager-cainjector
    digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
  - name: quay.io/jetstack/cert-manager-webhook
    digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae

# The release sets no resources. Small requests keep these off someguy's
# share; memory limits bound the Secret caches of the controller and cainjector.
patches:
  - target: { kind: Deployment, namespace: cert-manager }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { memory: 512Mi }
